<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الاختبار | الخوارزمي</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at 20% 10%,rgba(116,72,232,.25),transparent 35%),
        radial-gradient(circle at 90% 80%,rgba(49,84,223,.20),transparent 35%),
        #050509;
    padding:20px;
}

.container{
    width:min(900px,100%);
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.logo{
    font-size:24px;
    font-weight:900;
}

.logo span{
    color:#805cff;
}

.back{
    color:#fff;
    text-decoration:none;
    background:#171722;
    border:1px solid rgba(255,255,255,.1);
    padding:10px 16px;
    border-radius:12px;
}

.card{
    background:rgba(17,17,28,.94);
    border:1px solid rgba(140,100,255,.18);
    border-radius:22px;
    padding:24px;
    margin-bottom:18px;
}

.loading{
    text-align:center;
    padding:60px 20px;
    color:#bbb;
}

.error{
    display:none;
    color:#ff858f;
    line-height:1.8;
    white-space:pre-wrap;
}

.exam{
    display:none;
}

.exam-title{
    font-size:28px;
    margin-bottom:10px;
}

.description{
    color:#999;
    line-height:1.8;
}

.info{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:18px;
}

.badge{
    background:#0b0b13;
    border:1px solid #29293b;
    padding:8px 12px;
    border-radius:10px;
    color:#bbb;
}

.question{
    background:#0b0b13;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

.question-number{
    color:#a98cff;
    font-weight:bold;
    margin-bottom:12px;
}

.question-text{
    font-size:18px;
    line-height:1.9;
    margin-bottom:18px;
}

.options{
    display:grid;
    gap:10px;
}

.option{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
    border:1px solid #29293b;
    background:#11111b;
    border-radius:12px;
    cursor:pointer;
}

.option:hover{
    border-color:#805cff;
}

.option input{
    width:18px;
    height:18px;
    accent-color:#805cff;
}

.timer{
    position:sticky;
    top:10px;
    z-index:5;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.warning{
    color:#ff737f;
}

.submit{
    width:100%;
    border:0;
    padding:15px;
    border-radius:14px;
    background:linear-gradient(135deg,#805cff,#3154df);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

@media(max-width:600px){
    body{
        padding:12px;
    }

    .card{
        padding:17px;
    }

    .exam-title{
        font-size:23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            الخوارزمي <span>|</span> الاختبار
        </div>

        <a href="tests.html" class="back">
            ← الاختبارات
        </a>

    </div>


    <div id="loading" class="card loading">
        جاري تحميل الاختبار...
    </div>


    <div id="error" class="card error"></div>


    <div id="exam" class="exam">

        <div class="card">

            <h1 id="title" class="exam-title"></h1>

            <div id="description" class="description"></div>

            <div class="info">

                <span id="grade" class="badge"></span>

                <span id="duration" class="badge"></span>

                <span id="count" class="badge"></span>

            </div>

        </div>


        <div id="timer" class="card timer">
            ⏱ <span id="time">00:00</span>
        </div>


        <div id="questions"></div>


        <div class="card">

            <button
                id="submit"
                class="submit">

                إنهاء الاختبار

            </button>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

"use strict";


const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const examBox =
    document.getElementById("exam");

const titleElement =
    document.getElementById("title");

const descriptionElement =
    document.getElementById("description");

const gradeElement =
    document.getElementById("grade");

const durationElement =
    document.getElementById("duration");

const countElement =
    document.getElementById("count");

const questionsElement =
    document.getElementById("questions");

const timeElement =
    document.getElementById("time");

const timerElement =
    document.getElementById("timer");

const submitButton =
    document.getElementById("submit");


let client =
    window.supabaseClient;

let examId = null;

let examData = null;

let questions = [];

let timer = null;

let secondsLeft = 0;


/* =====================================================
   ERROR
===================================================== */

function showError(message){

    console.error(
        "EXAM ERROR:",
        message
    );

    loading.style.display =
        "none";

    examBox.style.display =
        "none";

    errorBox.style.display =
        "block";

    errorBox.textContent =
        message;

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   START
===================================================== */

(async function(){

    try{

        console.log(
            "1. بدء تحميل صفحة الاختبار"
        );


        if(!client){

            throw new Error(
                "Supabase Client غير موجود.\n\nتأكد أن js/supabase.js يتم تحميله قبل هذا الكود."
            );

        }


        console.log(
            "2. Supabase Client موجود"
        );


        /* ==============================================
           ID
        ============================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        examId =
            urlParams.get("id");


        console.log(
            "3. Exam ID:",
            examId
        );


        if(!examId){

            throw new Error(
                "لم يتم العثور على id للاختبار في الرابط.\n\nالرابط الصحيح يجب أن يكون:\nexam.html?id=EXAM_ID"
            );

        }


        /* ==============================================
           USER
        ============================================== */

        const {
            data:userData,
            error:userError
        } =
        await client.auth.getUser();


        console.log(
            "4. User:",
            userData?.user
        );


        if(userError){

            throw new Error(
                "خطأ في تسجيل الدخول:\n" +
                userError.message
            );

        }


        if(!userData?.user){

            location.href =
                "auth.html";

            return;

        }


        /* ==============================================
           EXAM
        ============================================== */

        console.log(
            "5. جاري تحميل الاختبار من exams..."
        );


        const {
            data:exam,
            error:examError
        } =
        await client
            .from("exams")
            .select("*")
            .eq("id",examId)
            .maybeSingle();


        console.log(
            "6. Exam result:",
            exam,
            examError
        );


        if(examError){

            throw new Error(
                "خطأ في قراءة جدول exams:\n" +
                examError.message
            );

        }


        if(!exam){

            throw new Error(
                "لم يتم العثور على الاختبار.\n\nExam ID:\n" +
                examId
            );

        }


        if(
            exam.is_active === false
        ){

            throw new Error(
                "هذا الاختبار غير نشط حاليًا."
            );

        }


        examData =
            exam;


        /* ==============================================
           QUESTIONS
        ============================================== */

        console.log(
            "7. جاري تحميل الأسئلة..."
        );


        const {
            data:questionData,
            error:questionError
        } =
        await client
            .from("questions")
            .select("*")
            .eq(
                "exam_id",
                examId
            )
            .order(
                "question_order",
                {
                    ascending:true
                }
            );


        console.log(
            "8. Questions:",
            questionData,
            questionError
        );


        if(questionError){

            throw new Error(
                "خطأ في قراءة جدول questions:\n" +
                questionError.message
            );

        }


        if(
            !questionData ||
            questionData.length === 0
        ){

            throw new Error(
                "الاختبار موجود ولكن لا توجد أسئلة مرتبطة به."
            );

        }


        questions =
            questionData;


        /* ==============================================
           DISPLAY
        ============================================== */

        titleElement.textContent =
            exam.title || "اختبار";


        descriptionElement.textContent =
            exam.description ||
            "اختبار رياضيات";


        gradeElement.textContent =
            "📚 " +
            (exam.grade || "غير محدد");


        const duration =
            Number(
                exam.duration_minutes ||
                exam.duration ||
                30
            );


        durationElement.textContent =
            "⏱ " +
            duration +
            " دقيقة";


        countElement.textContent =
            "📝 " +
            questions.length +
            " سؤال";


        renderQuestions();


        loading.style.display =
            "none";

        examBox.style.display =
            "block";


        startTimer(
            duration * 60
        );


        console.log(
            "9. تم تحميل الاختبار بنجاح ✅"
        );


    }catch(error){

        showError(
            error?.message ||
            "حدث خطأ غير معروف."
        );

    }

})();


/* =====================================================
   RENDER
===================================================== */

function renderQuestions(){

    questionsElement.innerHTML =
        "";


    questions.forEach(
        (q,index) => {

            const div =
                document.createElement("div");

            div.className =
                "card question";


            let options = "";


            const values = [
                ["a",q.option_a],
                ["b",q.option_b],
                ["c",q.option_c],
                ["d",q.option_d]
            ];


            values.forEach(
                ([letter,value]) => {

                    if(
                        value !== null &&
                        value !== undefined &&
                        String(value).trim() !== ""
                    ){

                        options += `

                            <label class="option">

                                <input
                                    type="radio"
                                    name="q_${escapeHTML(q.id)}"
                                    value="${letter}">

                                <span>
                                    ${escapeHTML(value)}
                                </span>

                            </label>

                        `;

                    }

                }
            );


            div.innerHTML = `

                <div class="question-number">
                    السؤال ${index + 1}
                </div>

                <div class="question-text">
                    ${escapeHTML(
                        q.question_text
                    )}
                </div>

                <div class="options">
                    ${options}
                </div>

            `;


            questionsElement.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(totalSeconds){

    secondsLeft =
        totalSeconds;


    updateTimer();


    timer =
        setInterval(
            () => {

                secondsLeft--;

                updateTimer();


                if(
                    secondsLeft <= 0
                ){

                    clearInterval(
                        timer
                    );

                    alert(
                        "انتهى وقت الاختبار."
                    );

                }

            },
            1000
        );

}


function updateTimer(){

    const minutes =
        Math.floor(
            secondsLeft / 60
        );

    const seconds =
        secondsLeft % 60;


    timeElement.textContent =
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");


    if(
        secondsLeft <= 60
    ){

        timerElement.classList.add(
            "warning"
        );

    }

}


/* =====================================================
   SUBMIT
===================================================== */

submitButton.addEventListener(
    "click",
    () => {

        alert(
            "تم اختيار إنهاء الاختبار.\nسيتم ربط الحفظ والنتيجة بعد التأكد من تحميل الاختبار والأسئلة بشكل صحيح."
        );

    }
);

</script>

</body>
</html>
