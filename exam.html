<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الاختبار | الخوارزمي</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 15% 10%,rgba(116,72,232,.25),transparent 35%),
        radial-gradient(circle at 90% 85%,rgba(49,84,223,.20),transparent 35%),
        #050509;
    color:#fff;
    padding:12px;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.logo{
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#805cff;
}

.back{
    color:#fff;
    text-decoration:none;
    background:#171722;
    border:1px solid rgba(255,255,255,.1);
    padding:9px 12px;
    border-radius:10px;
    white-space:nowrap;
}

.card{
    background:rgba(17,17,28,.94);
    border:1px solid rgba(140,100,255,.18);
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
}

.loading{
    text-align:center;
    padding:50px 15px;
    color:#bbb;
}

.loading-icon{
    font-size:35px;
    margin-bottom:15px;
}

.error{
    display:none;
    border-color:rgba(255,70,90,.4);
    background:rgba(80,15,25,.45);
}

.error-title{
    color:#ff6f7c;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.error-message{
    color:#ffd1d5;
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    background:#170b0e;
    border:1px solid rgba(255,80,100,.2);
    border-radius:12px;
    padding:14px;
    font-size:14px;
}

.error-step{
    color:#aaa;
    margin-top:12px;
    font-size:13px;
}

.retry{
    width:100%;
    border:0;
    margin-top:15px;
    padding:13px;
    border-radius:12px;
    background:linear-gradient(135deg,#805cff,#3154df);
    color:#fff;
    font-weight:bold;
    font-size:15px;
}

.exam{
    display:none;
}

.exam-title{
    font-size:25px;
    margin-bottom:8px;
}

.description{
    color:#999;
    line-height:1.8;
}

.info{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.badge{
    background:#0b0b13;
    border:1px solid #29293b;
    padding:7px 10px;
    border-radius:9px;
    color:#bbb;
    font-size:13px;
}

.timer{
    position:sticky;
    top:8px;
    z-index:10;
    text-align:center;
    font-size:21px;
    font-weight:bold;
}

.timer.warning{
    color:#ff6f7c;
    border-color:rgba(255,70,90,.4);
}

.question{
    background:#0b0b13;
}

.question-number{
    color:#a98cff;
    font-weight:bold;
    margin-bottom:12px;
}

.question-text{
    font-size:17px;
    line-height:1.9;
    margin-bottom:15px;
    overflow-wrap:anywhere;
}

.options{
    display:grid;
    gap:10px;
}

.option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    width:100%;
    padding:14px;
    border:1px solid #29293b;
    background:#11111b;
    border-radius:12px;
    cursor:pointer;
}

.option.selected{
    border-color:#805cff;
    background:rgba(128,92,255,.12);
}

.option input{
    flex:0 0 auto;
    width:19px;
    height:19px;
    margin-top:2px;
    accent-color:#805cff;
}

.option-letter{
    flex:0 0 30px;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#211b35;
    color:#bcaaff;
    border-radius:7px;
    font-weight:bold;
    direction:ltr;
}

.option-text{
    flex:1;
    min-width:0;
    color:#fff;
    font-size:15px;
    line-height:1.8;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.submit{
    width:100%;
    border:0;
    padding:15px;
    border-radius:13px;
    background:linear-gradient(135deg,#805cff,#3154df);
    color:#fff;
    font-size:16px;
    font-weight:bold;
}

.submit:disabled{
    opacity:.6;
}

.result{
    display:none;
    text-align:center;
}

.result-icon{
    font-size:60px;
    margin-bottom:10px;
}

.result-title{
    font-size:25px;
    font-weight:bold;
    margin-bottom:20px;
}

.result.success .result-title{
    color:#61e6a7;
}

.result.fail .result-title{
    color:#ff6f7c;
}

.score{
    font-size:42px;
    font-weight:900;
    margin-bottom:8px;
}

.percentage{
    font-size:20px;
    color:#bbb;
    margin-bottom:20px;
}

.result-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.result-item{
    background:#0b0b13;
    border:1px solid #29293b;
    border-radius:12px;
    padding:13px;
}

.result-item-title{
    color:#888;
    font-size:12px;
    margin-bottom:5px;
}

.result-item-value{
    font-size:17px;
    font-weight:bold;
}

.back-tests{
    display:block;
    width:100%;
    margin-top:18px;
    padding:14px;
    border-radius:12px;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(135deg,#805cff,#3154df);
}

@media(max-width:600px){

    body{
        padding:9px;
    }

    .card{
        padding:14px;
    }

    .exam-title{
        font-size:21px;
    }

    .question-text{
        font-size:16px;
    }

    .option{
        padding:12px;
    }

    .option-text{
        font-size:14px;
    }

    .result-info{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            الخوارزمي <span>|</span> الاختبار
        </div>

        <a href="tests.html" class="back">
            ← الاختبارات
        </a>

    </div>


    <!-- LOADING -->

    <div id="loading" class="card loading">

        </div>

        </div>

    </div>


    <!-- ERROR -->

    <div id="errorBox" class="card error">

        <div id="errorMessage"
             class="error-message">
        </div>

        <div id="errorStep"
             class="error-step">
        </div>

        <button
            class="retry"
            onclick="location.reload()">

        </button>

    <!-- EXAM -->

    <div id="exam" class="exam">

        <div class="card">

             class="score">
            0 / 0
        </div>

        <div id="percentage"
             class="percentage">
            0%
        </div>

        <div class="result-info">

            <div class="result-item">

                <div class="result-item-title">
                    الإجابات الصحيحة
                </div>

                <div id="correctCount"
                     class="result-item-value">
                    0
                </div>

            </div>

            <div class="result-item">

                <div class="result-item-title">
                    إجابات خاطئة
                </div>

                <div id="wrongCount"
                     class="result-item-value">
                    0
                </div>

            </div>

            <div class="result-item">

                <div class="result-item-title">
                    الدرجة الكاملة
                </div>

                <div id="totalPoints"
                     class="result-item-value">
                    0
                </div>

            </div>

                <div class="result-item-title">
                    الحالة
                </div>

                <div id="passed"
                     class="result-item-value">
                </div>

            </div>

        </div>

        <a href="tests.html"
           class="back-tests">

            العودة إلى الاختبارات

        </a>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("errorBox");

const errorMessage =
    document.getElementById("errorMessage");

const errorStep =
    document.getElementById("errorStep");

const examBox =
    document.getElementById("exam");

const resultBox =
    document.getElementById("result");

const examTitle =
    document.getElementById("examTitle");

const examDescription =
    document.getElementById("examDescription");

const examGrade =
    document.getElementById("examGrade");

const examDuration =
    document.getElementById("examDuration");

const examQuestions =
    document.getElementById("examQuestions");

const questionsBox =
    document.getElementById("questions");

const timerBox =
    document.getElementById("timer");

const timeBox =
    document.getElementById("time");

const submitButton =
    document.getElementById("submit");


/* =====================================================
   STATE
===================================================== */

let client = null;

let examId = null;

let currentExam = null;

let questions = [];

let currentUser = null;

let attemptId = null;

let timer = null;

let secondsLeft = 0;

let submitting = false;


/* =====================================================
   ERROR
===================================================== */

function showError(message,step=""){

    console.error(
        "EXAM ERROR:",
        message
    );

    loading.style.display =
        "none";

    examBox.style.display =
        "none";

    resultBox.style.display =
        "none";

    errorBox.style.display =
        "block";

    errorMessage.textContent =
        message;

    errorStep.textContent =
        step
        ? "📍 المرحلة: " + step
        : "";

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalizeAnswer(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
        .trim()
        .toLowerCase()
        .replace(/[()]/g,"");

}


/* =====================================================
   CREATE ATTEMPT
===================================================== */

async function createAttempt(){

    const {
        data,
        error
    } =
    await client
        .from("exam_attempts")
        .insert({

            exam_id:
                examId,

            student_id:
                currentUser.id

        })
        .select("id")
        .single();


    if(error){

        throw new Error(
            "تعذر إنشاء محاولة الاختبار.\n\n" +
            error.message +
            "\n\n" +
            JSON.stringify(
                error,
                null,
                2
            )
        );

    }


    if(!data?.id){

        throw new Error(
            "تم إنشاء المحاولة ولكن لم يتم الحصول على attempt_id."
        );

    }


    attemptId =
        data.id;

}


/* =====================================================
   START
===================================================== */

async function start(){

    try{

        client =
            window.supabaseClient;


        if(!client){

            showError(
                "لم يتم إنشاء اتصال Supabase.",
                "الاتصال بقاعدة البيانات"
            );

            return;

        }


        /* URL */

        const params =
            new URLSearchParams(
                window.location.search
            );


        examId =
            params.get("id");


        if(!examId){

            showError(
                "معرف الاختبار غير موجود في الرابط.",
                "رابط الاختبار"
            );

            return;

        }


        /* USER */

        const {
            data:userData,
            error:userError
        } =
        await client.auth.getUser();


        if(userError){

            showError(
                userError.message,
                "التحقق من تسجيل الدخول"
            );

            return;

        }


        if(!userData?.user){

            showError(
                "أنت غير مسجل الدخول.\nسيتم تحويلك إلى صفحة الدخول.",
                "تسجيل الدخول"
            );

            setTimeout(
                () => {

                    location.href =
                        "auth.html";

                },
                1500
            );

            return;

        }


        currentUser =
            userData.user;


        /* EXAM */

        const {
            data:exam,
            error:examError
        } =
        await client
            .from("exams")
            .select("*")
            .eq("id",examId)
            .maybeSingle();


        if(examError){

            showError(
                examError.message,
                "قراءة جدول exams"
            );

            return;

        }


        if(!exam){

            showError(
                "الاختبار غير موجود.",
                "البحث عن الاختبار"
            );

            return;

        }


        if(exam.is_active === false){

            showError(
                "هذا الاختبار غير متاح حاليًا.",
                "حالة الاختبار"
            );

            return;

        }


        currentExam =
            exam;


        /* QUESTIONS */

        const {
            data:questionData,
            error:questionError
        } =
        await client
            .from("questions")
            .select("*")
            .eq(
                "exam_id",
                examId
            )
            .order(
                "question_order",
                {
                    ascending:true
                }
            );


        if(questionError){

            showError(
                questionError.message,
                "قراءة جدول questions"
            );

            return;

        }


        if(
            !questionData ||
            questionData.length === 0
        ){

            showError(
                "الاختبار موجود ولكن لا توجد أسئلة.",
                "تحميل الأسئلة"
            );

            return;

        }


        questions =
            questionData;


        /*
         * إنشاء محاولة حقيقية
         * قبل إنشاء النتيجة
         */

        await createAttempt();


        /* DISPLAY */

        examTitle.textContent =
            exam.title ||
            "اختبار";


        examDescription.textContent =
            exam.description ||
            "اختبار رياضيات";


        examGrade.textContent =
            "📚 " +
            (
                exam.grade ||
                "غير محدد"
            );


        const duration =
            Number(
                exam.duration_minutes ||
                exam.duration ||
                30
            );


        examDuration.textContent =
            "⏱ " +
            duration +
            " دقيقة";


        examQuestions.textContent =
            "📝 " +
            questions.length +
            " سؤال";


        renderQuestions();


        loading.style.display =
            "none";

        errorBox.style.display =
            "none";

        examBox.style.display =
            "block";


        startTimer(
            duration * 60
        );


    }catch(error){

        showError(
            error?.message ||
            String(error),
            "تحميل الاختبار"
        );

    }

}


/* =====================================================
   QUESTIONS
===================================================== */

function renderQuestions(){

    questionsBox.innerHTML =
        "";


    questions.forEach(
        (question,index) => {

            const card =
                document.createElement("div");


            card.className =
                "card question";


            let optionsHTML =
                "";


            const options = [

                ["a",question.option_a],

                ["b",question.option_b],

                ["c",question.option_c],

                ["d",question.option_d]

            ];


            options.forEach(
                ([letter,value]) => {

                    if(
                        value !== null &&
                        value !== undefined &&
                        String(value).trim() !== ""
                    ){

                        optionsHTML += `

                            <label
                                class="option"
                                data-letter="${letter}"
                            >

                                <input
                                    type="radio"
                                    name="question_${escapeHTML(question.id)}"
                                    value="${letter}"
                                >

                                <span class="option-letter">
                                    ${letter.toUpperCase()}
                                </span>

                                <span class="option-text">
                                    ${escapeHTML(value)}
                                </span>

                            </label>

                        `;

                    }

                }
            );


            card.innerHTML = `

                <div class="question-number">
                    السؤال ${index + 1}
                </div>

                <div class="question-text">
                    ${escapeHTML(
                        question.question_text
                    )}
                </div>

                <div class="options">
                    ${optionsHTML}
                </div>

            `;


            questionsBox.appendChild(card);

        }
    );


    questionsBox
        .querySelectorAll(".option")
        .forEach(
            option => {

                option.addEventListener(
                    "click",
                    () => {

                        option
                            .parentElement
                            .querySelectorAll(".option")
                            .forEach(
                                x =>
                                    x.classList.remove(
                                        "selected"
                                    )
                            );


                        option.classList.add(
                            "selected"
                        );

                    }
                );

            }
        );

}


/* =====================================================
   ANSWERS
===================================================== */

function getAnswers(){

    const answers = {};


    questions.forEach(
        question => {

            const input =
                document.querySelector(
                    `input[name="question_${CSS.escape(String(question.id))}"]:checked`
                );


            answers[
                String(question.id)
            ] =
                input
                ? normalizeAnswer(input.value)
                : "";

        }
    );


    return answers;

}


/* =====================================================
   CALCULATE
===================================================== */

function calculateResult(){

    const answers =
        getAnswers();


    let score =
        0;

    let totalPoints =
        0;

    let correctCount =
        0;

    let wrongCount =
        0;


    questions.forEach(
        question => {

            const points =
                Number(
                    question.points
                ) || 1;


            totalPoints +=
                points;


            const studentAnswer =
                normalizeAnswer(
                    answers[
                        String(question.id)
                    ]
                );


            const correctAnswer =
                normalizeAnswer(
                    question.correct_answer
                );


            if(
                studentAnswer &&
                studentAnswer === correctAnswer
            ){

                score +=
                    points;

                correctCount++;

            }else{

                wrongCount++;

            }

        }
    );


    const percentage =
        totalPoints > 0
        ? Math.round(
            (score / totalPoints) * 100
        )
        : 0;


    const passed =
        percentage >= 50;


    return {

        score,

        totalPoints,

        percentage,

        passed,

        correctCount,

        wrongCount

    };

}


/* =====================================================
   SAVE RESULT
===================================================== */

async function saveResult(result){

    const payload = {

        exam_id:
            examId,

        student_id:
            currentUser.id,

        attempt_id:
            attemptId,

        score:
            result.score,

        total_points:
            result.totalPoints,

        percentage:
            result.percentage,

        passed:
            result.passed

    };


    console.log(
        "RESULT:",
        payload
    );


    const {
        error
    } =
    await client
        .from("results")
        .insert(payload);


    if(error){

        throw new Error(
            "تعذر حفظ النتيجة.\n\n" +
            error.message +
            "\n\n" +
            JSON.stringify(
                error,
                null,
                2
            )
        );

    }

}


/* =====================================================
   SHOW RESULT
===================================================== */

function showResult(result){

    examBox.style.display =
        "none";

    errorBox.style.display =
        "none";

    resultBox.style.display =
        "block";


    const resultIcon =
        document.getElementById(
            "resultIcon"
        );

    const resultTitle =
        document.getElementById(
            "resultTitle"
        );


    resultBox.classList.remove(
        "success",
        "fail"
    );


    if(result.passed){

        resultBox.classList.add(
            "success"
        );

        resultIcon.textContent =
            "🏆";

        resultTitle.textContent =
            "مبروك! أنت ناجح 🎉";

    }else{

        resultBox.classList.add(
            "fail"
        );

        resultIcon.textContent =
            "📚";

        resultTitle.textContent =
            "لم تحقق درجة النجاح";

    }


    document.getElementById(
        "score"
    ).textContent =
        `${result.score} / ${result.totalPoints}`;


    document.getElementById(
        "percentage"
    ).textContent =
        `${result.percentage}%`;


    document.getElementById(
        "correctCount"
    ).textContent =
        result.correctCount;


    document.getElementById(
        "wrongCount"
    ).textContent =
        result.wrongCount;


    document.getElementById(
        "totalPoints"
    ).textContent =
        result.totalPoints;


    document.getElementById(
        "passed"
    ).textContent =
        result.passed
        ? "ناجح ✅"
        : "راسب ❌";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   SUBMIT
===================================================== */

async function submitExam(autoSubmit=false){

    if(submitting){

        return;

    }


    /*
     * دي نقطة التأكيد:
     *
     * الطالب يضغط إنهاء
     * تظهر رسالة:
     * هل أنت متأكد؟
     */

    if(!autoSubmit){

        const confirmed =
            confirm(
                "⚠️ هل أنت متأكد من إنهاء الاختبار؟\n\nنعم = تصحيح الاختبار وإظهار النتيجة فورًا.\nإلغاء = العودة للأسئلة."
            );


        if(!confirmed){

            return;

        }

    }


    submitting =
        true;


    submitButton.disabled =
        true;


    try{

        clearInterval(timer);


        /*
         * تصحيح فوري
         */

        const result =
            calculateResult();


        /*
         * حفظ النتيجة
         */

        await saveResult(
            result
        );


        /*
         * إظهار النتيجة فورًا
         */

        showResult(
            result
        );


    }catch(error){

        submitting =
            false;

        submitButton.disabled =
            false;


        showError(
            error?.message ||
            String(error),
            "حفظ وتصحيح النتيجة"
        );

    }

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(seconds){

    clearInterval(timer);


    secondsLeft =
        Number(seconds) || 1800;


    updateTimer();


    timer =
        setInterval(
            () => {

                secondsLeft--;

                updateTimer();


                if(
                    secondsLeft <= 0
                ){

                    clearInterval(timer);


                    alert(
                        "⏰ انتهى وقت الاختبار.\nسيتم تصحيح إجاباتك الآن."
                    );


                    submitExam(true);

                }

            },
            1000
        );

}


function updateTimer(){

    const minutes =
        Math.floor(
            secondsLeft / 60
        );


    const seconds =
        secondsLeft % 60;


    timeBox.textContent =
        String(minutes)
            .padStart(2,"0") +
        ":" +
        String(seconds)
            .padStart(2,"0");


    if(secondsLeft <= 60){

        timerBox.classList.add(
            "warning"
        );

    }

}


/* =====================================================
   BUTTON
===================================================== */

submitButton.addEventListener(
    "click",
    () => {

        submitExam(false);

    }
);


/* =====================================================
   START
===================================================== */

start();

</script>

</body>
</html>
