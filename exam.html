<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>الاختبار | الخوارزمي</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:
        Arial,
        Tahoma,
        sans-serif;
}


/* =====================================================
   BODY
===================================================== */

body{

    min-height:100vh;

    background:

        radial-gradient(
            circle at 15% 10%,
            rgba(116,72,232,.25),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 85%,
            rgba(49,84,223,.20),
            transparent 35%
        ),

        #050509;

    color:#fff;

    padding:12px;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    width:100%;

    max-width:900px;

    margin:auto;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-bottom:18px;

}

.logo{

    font-size:21px;

    font-weight:900;

}

.logo span{

    color:#805cff;

}

.back{

    color:#fff;

    text-decoration:none;

    background:#171722;

    border:1px solid rgba(255,255,255,.1);

    padding:9px 12px;

    border-radius:10px;

    white-space:nowrap;

}


/* =====================================================
   CARD
===================================================== */

.card{

    background:rgba(17,17,28,.94);

    border:1px solid rgba(140,100,255,.18);

    border-radius:18px;

    padding:18px;

    margin-bottom:15px;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    padding:50px 15px;

    color:#bbb;

}

.loading-icon{

    font-size:35px;

    margin-bottom:15px;

}


/* =====================================================
   ERROR
===================================================== */

.error{

    display:none;

    border-color:
        rgba(255,70,90,.4);

    background:
        rgba(80,15,25,.45);

}

.error-title{

    color:#ff6f7c;

    font-size:20px;

    font-weight:bold;

    margin-bottom:15px;

}

.error-message{

    color:#ffd1d5;

    line-height:1.8;

    white-space:pre-wrap;

    word-break:break-word;

    background:#170b0e;

    border:1px solid
        rgba(255,80,100,.2);

    border-radius:12px;

    padding:14px;

    font-size:14px;

}


/* =====================================================
   EXAM
===================================================== */

.exam{

    display:none;

}

.exam-title{

    font-size:25px;

    margin-bottom:8px;

}

.description{

    color:#999;

    line-height:1.8;

}

.info{

    display:flex;

    flex-wrap:wrap;

    gap:8px;

    margin-top:15px;

}

.badge{

    background:#0b0b13;

    border:1px solid #29293b;

    padding:7px 10px;

    border-radius:9px;

    color:#bbb;

    font-size:13px;

}


/* =====================================================
   TIMER
===================================================== */

.timer{

    position:sticky;

    top:8px;

    z-index:10;

    text-align:center;

    font-size:21px;

    font-weight:bold;

}

.timer.warning{

    color:#ff6f7c;

    border-color:
        rgba(255,70,90,.4);

}


/* =====================================================
   QUESTION
===================================================== */

.question{

    background:#0b0b13;

}

.question-number{

    color:#a98cff;

    font-weight:bold;

    margin-bottom:12px;

}

.question-text{

    font-size:17px;

    line-height:1.9;

    margin-bottom:15px;

}


/* =====================================================
   OPTIONS
===================================================== */

.options{

    display:grid;

    gap:10px;

}

.option{

    display:flex;

    align-items:flex-start;

    gap:10px;

    padding:14px;

    border:1px solid #29293b;

    background:#11111b;

    border-radius:11px;

    cursor:pointer;

    transition:.2s;

}

.option:hover{

    border-color:#805cff;

    background:#151323;

}

.option input{

    width:19px;

    height:19px;

    accent-color:#805cff;

    flex-shrink:0;

    margin-top:2px;

}

.option-letter{

    width:28px;

    height:28px;

    min-width:28px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:8px;

    background:#211b38;

    color:#bba8ff;

    font-weight:bold;

}

.option-text{

    line-height:1.7;

}


/* =====================================================
   SUBMIT
===================================================== */

.submit{

    width:100%;

    border:0;

    padding:15px;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #805cff,
            #3154df
        );

    color:#fff;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(8px);

    display:none;

    align-items:center;

    justify-content:center;

    padding:18px;

    z-index:1000;

}

.modal.show{

    display:flex;

}

.modal-box{

    width:100%;

    max-width:390px;

    background:
        linear-gradient(
            180deg,
            #191624,
            #0d0d14
        );

    border:
        1px solid
        rgba(128,92,255,.35);

    border-radius:24px;

    padding:25px;

    text-align:center;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.6);

    animation:
        modalIn .25s ease;

}

@keyframes modalIn{

    from{

        opacity:0;

        transform:
            translateY(20px)
            scale(.96);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   TEACHER IMAGE
===================================================== */

.teacher-image{

    width:105px;

    height:105px;

    object-fit:cover;

    border-radius:50%;

    border:
        3px solid
        #805cff;

    box-shadow:
        0 0 30px
        rgba(128,92,255,.45);

    margin-bottom:15px;

}

.modal-title{

    font-size:22px;

    font-weight:900;

    margin-bottom:10px;

}

.modal-text{

    color:#aaa;

    line-height:1.8;

    margin-bottom:20px;

}

.modal-buttons{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

}

.modal-btn{

    border:0;

    padding:13px;

    border-radius:12px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

}

.cancel{

    background:#22222d;

    color:#fff;

}

.confirm{

    background:
        linear-gradient(
            135deg,
            #805cff,
            #3154df
        );

    color:#fff;

}


/* =====================================================
   RESULT MODAL
===================================================== */

.result-modal-box{

    width:100%;

    max-width:420px;

    background:#11111b;

    border:
        1px solid
        rgba(128,92,255,.35);

    border-radius:25px;

    padding:25px;

    text-align:center;

}

.result-title{

    font-size:25px;

    font-weight:900;

    margin-bottom:18px;

}

.result-score{

    font-size:42px;

    font-weight:900;

    color:#bba8ff;

    margin-bottom:8px;

}

.result-percentage{

    color:#aaa;

    margin-bottom:20px;

}

.result-points{

    background:#0b0b13;

    border:1px solid #29293b;

    border-radius:14px;

    padding:16px;

    margin-bottom:18px;

}

.result-points strong{

    display:block;

    color:#c4aaff;

    font-size:25px;

    margin-top:5px;

}

.result-close{

    width:100%;

    border:0;

    padding:14px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #805cff,
            #3154df
        );

    color:#fff;

    font-weight:bold;

    font-size:15px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{

        align-items:flex-start;

    }

    .logo{

        font-size:18px;

    }

    .exam-title{

        font-size:21px;

    }

    .question-text{

        font-size:16px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =================================================
         HEADER
    ================================================= -->

    <div class="header">

        <div class="logo">

            الاختبار

        </div>


        <a
            href="tests.html"
            class="back"
        >

            ← الاختبارات

        </a>

    </div>


    <!-- =================================================
         LOADING
    ================================================= -->

    <div
        id="loading"
        class="card loading"
    >

        <div class="loading-icon">

            جاري التحميل

        </div>

        <div>

            جاري تحميل الاختبار...

    <!-- =================================================

    ================================================= -->

        id="errorBox"

<div

        >

            0%

        </div>

                +0

            </strong>

<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
    document.getElementById(
        "loading"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

const examBox =
    document.getElementById(
        "exam"
    );

const examTitle =
    document.getElementById(
        "examTitle"
    );

const examDescription =
    document.getElementById(
        "examDescription"
    );

const examGrade =
    document.getElementById(
        "examGrade"
    );

const examDuration =
    document.getElementById(
        "examDuration"
    );

const examQuestions =
    document.getElementById(
        "examQuestions"
    );

const questionsBox =
    document.getElementById(
        "questions"
    );

const timerBox =
    document.getElementById(
        "timer"
    );

const timeBox =
    document.getElementById(
        "time"
    );

const submitButton =
    document.getElementById(
        "submit"
    );

const confirmModal =
    document.getElementById(
        "confirmModal"
    );

const cancelSubmit =
    document.getElementById(
        "cancelSubmit"
    );

const confirmSubmit =
    document.getElementById(
        "confirmSubmit"
    );

const resultModal =
    document.getElementById(
        "resultModal"
    );

const resultScore =
    document.getElementById(
        "resultScore"
    );

const resultPercentage =
    document.getElementById(
        "resultPercentage"
    );

const resultPoints =
    document.getElementById(
        "resultPoints"
    );

const resultClose =
    document.getElementById(
        "resultClose"
    );


/* =====================================================
   STATE
===================================================== */

let client = null;

let examId = null;

let currentExam = null;

let questions = [];

let currentUser = null;

let timer = null;

let secondsLeft = 0;

let submitting = false;


/* =====================================================
   ERROR
===================================================== */

function showError(
    message
){

    console.error(
        message
    );

    loading.style.display =
        "none";

    examBox.style.display =
        "none";

    errorBox.style.display =
        "block";

    errorMessage.textContent =
        message;

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   START
===================================================== */

async function start(){

    try{


        /* =============================================
           SUPABASE
        ============================================= */

        client =
            window.supabaseClient;


        if(!client){

            showError(
                "لم يتم إنشاء اتصال Supabase.\n\n" +
                "تأكد من ملف js/supabase.js"
            );

            return;

        }


        /* =============================================
           EXAM ID
        ============================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        examId =
            params.get(
                "id"
            );


        if(!examId){

            showError(
                "معرف الاختبار غير موجود في الرابط."
            );

            return;

        }


        /* =============================================
           USER
        ============================================= */

        const {
            data:userData,
            error:userError
        } =
        await client.auth.getUser();


        if(userError){

            showError(
                userError.message
            );

            return;

        }


        if(!userData?.user){

            location.href =
                "auth.html";

            return;

        }


        currentUser =
            userData.user;


        /* =============================================
           EXAM
        ============================================= */

        const {
            data:exam,
            error:examError
        } =
        await client
            .from("exams")
            .select("*")
            .eq(
                "id",
                examId
            )
            .maybeSingle();


        if(examError){

            showError(
                "تعذر تحميل الاختبار:\n\n" +
                examError.message
            );

            return;

        }


        if(!exam){

            showError(
                "الاختبار غير موجود."
            );

            return;

        }


        if(
            exam.is_active === false
        ){

            showError(
                "هذا الاختبار غير متاح حاليًا."
            );

            return;

        }


        currentExam =
            exam;


        /* =============================================
           QUESTIONS
        ============================================= */

        const {
            data:questionData,
            error:questionError
        } =
        await client
            .from("questions")
            .select("*")
            .eq(
                "exam_id",
                examId
            )
            .order(
                "question_order",
                {
                    ascending:true
                }
            );


        if(questionError){

            showError(
                "تعذر تحميل الأسئلة:\n\n" +
                questionError.message
            );

            return;

        }


        if(
            !questionData ||
            questionData.length === 0
        ){

            showError(
                "الاختبار موجود ولكن لا توجد أسئلة."
            );

            return;

        }


        questions =
            questionData;


        /* =============================================
           DISPLAY
        ============================================= */

        examTitle.textContent =
            exam.title ||
            "اختبار";


        examDescription.textContent =
            exam.description ||
            "اختبار رياضيات";


        examGrade.textContent =
            "الصف: " +
            (
                exam.grade ||
                "غير محدد"
            );


        const duration =
            Number(
                exam.duration_minutes ||
                exam.duration ||
                30
            );


        examDuration.textContent =
            "المدة: " +
            duration +
            " دقيقة";


        examQuestions.textContent =
            "عدد الأسئلة: " +
            questions.length;


        renderQuestions();


        loading.style.display =
            "none";

        errorBox.style.display =
            "none";

        examBox.style.display =
            "block";


        startTimer(
            duration * 60
        );


    }
    catch(error){

        showError(
            error?.message ||
            String(error)
        );

    }

}


/* =====================================================
   QUESTIONS
===================================================== */

function renderQuestions(){

    questionsBox.innerHTML =
        "";


    questions.forEach(
        (
            question,
            index
        ) => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card question";


            let optionsHTML =
                "";


            const options = [

                [
                    "a",
                    question.option_a
                ],

                [
                    "b",
                    question.option_b
                ],

                [
                    "c",
                    question.option_c
                ],

                [
                    "d",
                    question.option_d
                ]

            ];


            options.forEach(
                (
                    [letter,value]
                ) => {


                    if(
                        value !== null &&
                        value !== undefined &&
                        String(value)
                            .trim() !== ""
                    ){


                        optionsHTML += `

                            <label
                                class="option"
                            >

                                <input
                                    type="radio"
                                    name="question_${escapeHTML(
                                        question.id
                                    )}"
                                    value="${letter}"
                                >

                                <span
                                    class="option-letter"
                                >
                                    ${letter.toUpperCase()}
                                </span>

                                <span
                                    class="option-text"
                                >
                                    ${escapeHTML(
                                        value
                                    )}
                                </span>

                            </label>

                        `;

                    }

                }
            );


            card.innerHTML = `

                <div class="question-number">

                    السؤال
                    ${index + 1}

                </div>


                <div class="question-text">

                    ${escapeHTML(
                        question.question_text
                    )}

                </div>


                <div class="options">

                    ${optionsHTML}

                </div>

            `;


            questionsBox.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(
    seconds
){

    secondsLeft =
        Number(seconds) ||
        1800;


    updateTimer();


    timer =
        setInterval(
            () => {


                secondsLeft--;


                updateTimer();


                if(
                    secondsLeft <= 0
                ){

                    clearInterval(
                        timer
                    );


                    submitExam(
                        true
                    );

                }


            },
            1000
        );

}


function updateTimer(){

    const minutes =
        Math.floor(
            secondsLeft / 60
        );


    const seconds =
        secondsLeft % 60;


    timeBox.textContent =

        String(minutes)
            .padStart(
                2,
                "0"
            )

        +

        ":"

        +

        String(seconds)
            .padStart(
                2,
                "0"
            );


    if(
        secondsLeft <= 60
    ){

        timerBox.classList.add(
            "warning"
        );

    }

}


/* =====================================================
   OPEN CONFIRM
===================================================== */

submitButton.addEventListener(
    "click",
    () => {


        if(submitting){

            return;

        }


        confirmModal.classList.add(
            "show"
        );

    }
);


/* =====================================================
   CANCEL
===================================================== */

cancelSubmit.addEventListener(
    "click",
    () => {

        confirmModal.classList.remove(
            "show"
        );

    }
);


/* =====================================================
   CONFIRM
===================================================== */

confirmSubmit.addEventListener(
    "click",
    () => {

        submitExam(
            false
        );

    }
);


/* =====================================================
   SUBMIT EXAM
===================================================== */

async function submitExam(
    autoSubmit
){

    if(submitting){

        return;

    }


    submitting =
        true;


    confirmSubmit.disabled =
        true;


    confirmSubmit.textContent =
        "جاري التصحيح...";


    try{


        if(timer){

            clearInterval(
                timer
            );

        }


        confirmModal.classList.remove(
            "show"
        );


        /* =============================================
           GET ANSWERS
        ============================================= */

        let score =
            0;

        let totalPoints =
            0;


        questions.forEach(
            question => {


                const points =
                    Number(
                        question.points
                    ) || 1;


                totalPoints +=
                    points;


                const selected =
                    document.querySelector(
                        `input[name="question_${question.id}"]:checked`
                    );


                if(!selected){

                    return;

                }


                const studentAnswer =
                    String(
                        selected.value
                    )
                    .trim()
                    .toLowerCase();


                const correctAnswer =
                    String(
                        question.correct_answer ??
                        ""
                    )
                    .trim()
                    .toLowerCase();


                if(
                    studentAnswer ===
                    correctAnswer
                ){

                    score +=
                        points;

                }

            }
        );


        /* =============================================
           PERCENTAGE
        ============================================= */

        const percentage =
            totalPoints > 0
            ? Math.round(
                (
                    score /
                    totalPoints
                ) * 100
            )
            : 0;


        /*
         * النجاح هنا 50%
         */

        const passed =
            percentage >= 50;


        /* =============================================
           EXAM ATTEMPT
        ============================================= */

        const {
            data:attempt,
            error:attemptError
        } =
        await client
            .from("exam_attempts")
            .insert({

                exam_id:
                    examId,

                student_id:
                    currentUser.id,

                started_at:
                    new Date(
                        Date.now() -
                        1
                    ).toISOString(),

                submitted_at:
                    new Date().toISOString(),

                score:
                    score,

                total_points:
                    totalPoints,

                status:
                    "completed"

            })
            .select("id")
            .single();


        if(attemptError){

            throw new Error(
                "تعذر إنشاء محاولة الاختبار:\n\n" +
                attemptError.message
            );

        }


        /* =============================================
           RESULT
        ============================================= */

        const {
            data:result,
            error:resultError
        } =
        await client
            .from("results")
            .insert({

                exam_id:
                    examId,

                student_id:
                    currentUser.id,

                attempt_id:
                    attempt.id,

                score:
                    score,

                total_points:
                    totalPoints,

                percentage:
                    percentage,

                passed:
                    passed

            })
            .select("*")
            .single();


        if(resultError){

            throw new Error(
                "تم إنشاء المحاولة ولكن فشل حفظ النتيجة:\n\n" +
                resultError.message
            );

        }


        /* =============================================
           ADD POINTS
        ============================================= */

        let finalPoints =
            0;


        if(score > 0){

            const {
                data:pointsData,
                error:pointsError
            } =
            await client.rpc(
                "add_student_points",
                {

                    p_student_id:
                        currentUser.id,

                    p_points:
                        score,

                    p_result_id:
                        result.id,

                    p_exam_id:
                        examId,

                    p_reason:
                        "إكمال اختبار " +
                        (
                            currentExam.title ||
                            ""
                        )

                }
            );


            if(pointsError){

                console.error(
                    "POINTS ERROR:",
                    pointsError
                );

                /*
                 * النتيجة لا تفشل لو النقاط
                 * واجهت مشكلة.
                 */

                finalPoints =
                    score;

            }
            else{

                finalPoints =
                    Number(
                        pointsData
                    ) || score;

            }

        }


        /* =============================================
           RESULT
        ============================================= */

        resultScore.textContent =

            score +
            " / " +
            totalPoints;


        resultPercentage.textContent =

            "النسبة: " +
            percentage +
            "%";


        resultPoints.innerHTML =

            "النقاط المكتسبة"

            +

            "<strong>+" +

            score +

            "</strong>";


        resultModal.classList.add(
            "show"
        );


    }
    catch(error){

        alert(
            "حدث خطأ أثناء حفظ النتيجة:\n\n" +
            (
                error?.message ||
                String(error)
            )
        );


        /*
         * لو حصل خطأ نعيد الزر
         */

        submitting =
            false;


        confirmSubmit.disabled =
            false;


        confirmSubmit.textContent =
            "نعم، إنهاء الاختبار";


        if(
            secondsLeft > 0
        ){

            startTimer(
                secondsLeft
            );

        }

    }

}


/* =====================================================
   RESULT CLOSE
===================================================== */

resultClose.addEventListener(
    "click",
    () => {

        location.href =
            "tests.html";

    }
);


/* =====================================================
   RUN
===================================================== */

start();

</script>

</body>

</html>
