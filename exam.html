<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الاختبار | الخوارزمي</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(116,72,232,.25),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(49,84,223,.20),
            transparent 35%
        ),
        #050509;

    color:#fff;
    padding:12px;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.logo{
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#805cff;
}

.back{
    color:#fff;
    text-decoration:none;
    background:#171722;
    border:1px solid rgba(255,255,255,.1);
    padding:9px 12px;
    border-radius:10px;
    white-space:nowrap;
}

.card{
    background:rgba(17,17,28,.94);
    border:1px solid rgba(140,100,255,.18);
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
}

.loading{
    text-align:center;
    padding:50px 15px;
    color:#bbb;
}

.loading-icon{
    font-size:35px;
    margin-bottom:15px;
}

.error{
    display:none;
    border-color:rgba(255,70,90,.4);
    background:rgba(80,15,25,.45);
}

.error-title{
    color:#ff6f7c;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.error-message{
    color:#ffd1d5;
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    background:#170b0e;
    border:1px solid rgba(255,80,100,.2);
    border-radius:12px;
    padding:14px;
    font-size:14px;
}

.error-step{
    color:#aaa;
    margin-top:12px;
    font-size:13px;
}

.retry{
    width:100%;
    border:0;
    margin-top:15px;
    padding:13px;
    border-radius:12px;
    background:linear-gradient(135deg,#805cff,#3154df);
    color:#fff;
    font-weight:bold;
    font-size:15px;
}

.exam{
    display:none;
}

.exam-title{
    font-size:25px;
    margin-bottom:8px;
}

.description{
    color:#999;
    line-height:1.8;
}

.info{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.badge{
    background:#0b0b13;
    border:1px solid #29293b;
    padding:7px 10px;
    border-radius:9px;
    color:#bbb;
    font-size:13px;
}

.timer{
    position:sticky;
    top:8px;
    z-index:10;
    text-align:center;
    font-size:21px;
    font-weight:bold;
}

.timer.warning{
    color:#ff6f7c;
    border-color:rgba(255,70,90,.4);
}

.question{
    background:#0b0b13;
}

.question-number{
    color:#a98cff;
    font-weight:bold;
    margin-bottom:12px;
}

.question-text{
    font-size:17px;
    line-height:1.9;
    margin-bottom:15px;
    overflow-wrap:anywhere;
}

.options{
    display:grid;
    gap:10px;
}

.option{
    display:flex;
    align-items:flex-start;
    gap:10px;

    width:100%;

    padding:14px;

    border:1px solid #29293b;
    background:#11111b;
    border-radius:12px;

    cursor:pointer;

    transition:.2s;
}

.option:hover{
    border-color:#805cff;
}

.option.selected{
    border-color:#805cff;
    background:rgba(128,92,255,.12);
}

.option input{
    flex:0 0 auto;

    width:19px;
    height:19px;

    margin-top:2px;

    accent-color:#805cff;
}

.option-letter{
    flex:0 0 28px;

    width:28px;
    height:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#211b35;
    color:#bcaaff;

    border-radius:7px;

    font-weight:bold;
    direction:ltr;
}

.option-text{
    flex:1;

    min-width:0;

    color:#fff;

    font-size:15px;
    line-height:1.8;

    overflow-wrap:anywhere;
    word-break:break-word;
}

.submit{
    width:100%;
    border:0;
    padding:15px;
    border-radius:13px;
    background:linear-gradient(135deg,#805cff,#3154df);
    color:#fff;
    font-size:16px;
    font-weight:bold;
}

.submit:disabled{
    opacity:.6;
}

.result{
    display:none;
    text-align:center;
}

.result-icon{
    font-size:60px;
    margin-bottom:10px;
}

.result-title{
    font-size:25px;
    font-weight:bold;
    margin-bottom:20px;
}

.result.success .result-title{
    color:#61e6a7;
}

.result.fail .result-title{
    color:#ff6f7c;
}

.score{
    font-size:42px;
    font-weight:900;
    margin-bottom:8px;
}

.percentage{
    font-size:20px;
    color:#bbb;
    margin-bottom:20px;
}

.result-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.result-item{
    background:#0b0b13;
    border:1px solid #29293b;
    border-radius:12px;
    padding:13px;
}

.result-item-title{
    color:#888;
    font-size:12px;
    margin-bottom:5px;
}

.result-item-value{
    font-size:17px;
    font-weight:bold;
}

.back-tests{
    display:block;
    width:100%;
    margin-top:18px;
    padding:14px;

    border-radius:12px;

    text-decoration:none;
    color:#fff;

    background:linear-gradient(135deg,#805cff,#3154df);
}

.debug{
    display:none;
    margin-top:15px;
    color:#777;
    font-size:11px;
    word-break:break-all;
}

@media(max-width:600px){

    body{
        padding:9px;
    }

    .card{
        padding:14px;
    }

    .exam-title{
        font-size:21px;
    }

    .question-text{
        font-size:16px;
    }

    .option{
        padding:12px;
    }

    .option-text{
        font-size:14px;
    }

    .result-info{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            الخوارزمي <span>|</span> الاختبار
        </div>

        <a href="tests.html" class="back">
            ← الاختبارات
        </a>

    </div>


    <!-- LOADING -->

    <div id="loading" class="card loading">

        <div class="loading-icon">
            ⏳
        </div>

        <div>
            جاري تحميل الاختبار...
        </div>

    </div>


    <!-- ERROR -->

    <div id="errorBox" class="card error">

        <div class="error-title">
            ⚠️ حدث خطأ
        </div>

        <div id="errorMessage"
             class="error-message">
        </div>

        <div id="errorStep"
             class="error-step">
        </div>

        <button
            class="retry"
            onclick="location.reload()">

            🔄 إعادة المحاولة

        </button>

        <div id="debug"
             class="debug">
        </div>

    </div>


    <!-- EXAM -->

    <div id="exam" class="exam">

        <div class="card">

            <h1 id="examTitle"
                class="exam-title">
            </h1>

            <div id="examDescription"
                 class="description">
            </div>

            <div class="info">

                <span id="examGrade"
                      class="badge">
                </span>

                <span id="examDuration"
                      class="badge">
                </span>

                <span id="examQuestions"
                      class="badge">
                </span>

            </div>

        </div>


        <div id="timer"
             class="card timer">

            ⏱
            <span id="time">
                00:00
            </span>

        </div>


        <div id="questions"></div>


        <div class="card">

            <button id="submit"
                    class="submit">

                إنهاء الاختبار

            </button>

        </div>

    </div>


    <!-- RESULT -->

    <div id="result"
         class="card result">

        <div id="resultIcon"
             class="result-icon">
            🏆
        </div>

        <div id="resultTitle"
             class="result-title">
            تم تصحيح الاختبار
        </div>

        <div id="score"
             class="score">
            0 / 0
        </div>

        <div id="percentage"
             class="percentage">
            0%
        </div>

        <div class="result-info">

            <div class="result-item">

                <div class="result-item-title">
                    الإجابات الصحيحة
                </div>

                <div id="correctCount"
                     class="result-item-value">
                    0
                </div>

            </div>


            <div class="result-item">

                <div class="result-item-title">
                    إجابات خاطئة
                </div>

                <div id="wrongCount"
                     class="result-item-value">
                    0
                </div>

            </div>


            <div class="result-item">

                <div class="result-item-title">
                    الدرجة الكاملة
                </div>

                <div id="totalPoints"
                     class="result-item-value">
                    0
                </div>

            </div>


            <div class="result-item">

                <div class="result-item-title">
                    الحالة
                </div>

                <div id="passed"
                     class="result-item-value">
                </div>

            </div>

        </div>


        <a href="tests.html"
           class="back-tests">

            العودة إلى الاختبارات

        </a>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("errorBox");

const errorMessage =
    document.getElementById("errorMessage");

const errorStep =
    document.getElementById("errorStep");

const debugBox =
    document.getElementById("debug");

const examBox =
    document.getElementById("exam");

const resultBox =
    document.getElementById("result");

const examTitle =
    document.getElementById("examTitle");

const examDescription =
    document.getElementById("examDescription");

const examGrade =
    document.getElementById("examGrade");

const examDuration =
    document.getElementById("examDuration");

const examQuestions =
    document.getElementById("examQuestions");

const questionsBox =
    document.getElementById("questions");

const timerBox =
    document.getElementById("timer");

const timeBox =
    document.getElementById("time");

const submitButton =
    document.getElementById("submit");


/* =====================================================
   STATE
===================================================== */

let client = null;

let examId = null;

let currentExam = null;

let questions = [];

let currentUser = null;

let timer = null;

let secondsLeft = 0;

let submitting = false;

let attemptId = null;


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message,step=""){

    console.error(
        "EXAM ERROR:",
        message
    );

    loading.style.display =
        "none";

    examBox.style.display =
        "none";

    resultBox.style.display =
        "none";

    errorBox.style.display =
        "block";

    errorMessage.textContent =
        message;

    errorStep.textContent =
        step
        ? "📍 المرحلة: " + step
        : "";

    debugBox.textContent =
        "URL: " +
        window.location.href;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   NORMALIZE ANSWER
===================================================== */

function normalizeAnswer(value){

    if(value === null ||
       value === undefined){

        return "";
    }

    return String(value)
        .trim()
        .toLowerCase();
}


/* =====================================================
   START
===================================================== */

async function start(){

    try{

        /* =============================================
           SUPABASE
        ============================================= */

        client =
            window.supabaseClient;


        if(!client){

            showError(
                "لم يتم إنشاء اتصال Supabase.",
                "الاتصال بقاعدة البيانات"
            );

            return;
        }


        /* =============================================
           EXAM ID
        ============================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );


        examId =
            params.get("id");


        if(!examId){

            showError(
                "معرف الاختبار غير موجود في الرابط.\n\nافتح الاختبار من صفحة الاختبارات واضغط «بدء الاختبار».",
                "قراءة رابط الاختبار"
            );

            return;
        }


        /* =============================================
           USER
        ============================================= */

        const {
            data:userData,
            error:userError
        } =
        await client.auth.getUser();


        if(userError){

            showError(
                "تعذر التحقق من تسجيل الدخول.\n\n" +
                userError.message,
                "التحقق من الطالب"
            );

            return;
        }


        if(!userData?.user){

            showError(
                "أنت غير مسجل الدخول.\n\nسيتم تحويلك إلى صفحة تسجيل الدخول.",
                "تسجيل الدخول"
            );

            setTimeout(
                () => {
                    location.href =
                        "auth.html";
                },
                1500
            );

            return;
        }


        currentUser =
            userData.user;


        /* =============================================
           EXAM
        ============================================= */

        const {
            data:exam,
            error:examError
        } =
        await client
            .from("exams")
            .select("*")
            .eq("id",examId)
            .maybeSingle();


        if(examError){

            showError(
                "تعذر قراءة الاختبار من قاعدة البيانات.\n\n" +
                examError.message,
                "قراءة جدول exams"
            );

            return;
        }


        if(!exam){

            showError(
                "الاختبار غير موجود.\n\nمعرف الاختبار:\n" +
                examId,
                "البحث عن الاختبار"
            );

            return;
        }


        if(exam.is_active === false){

            showError(
                "هذا الاختبار غير متاح حاليًا.",
                "حالة الاختبار"
            );

            return;
        }


        currentExam =
            exam;


        /* =============================================
           QUESTIONS
        ============================================= */

        const {
            data:questionData,
            error:questionError
        } =
        await client
            .from("questions")
            .select("*")
            .eq("exam_id",examId)
            .order(
                "question_order",
                {
                    ascending:true
                }
            );


        if(questionError){

            showError(
                "تم العثور على الاختبار، لكن تعذر تحميل الأسئلة.\n\n" +
                questionError.message,
                "قراءة جدول questions"
            );

            return;
        }


        if(
            !questionData ||
            questionData.length === 0
        ){

            showError(
                "الاختبار موجود، لكن لا توجد أسئلة مرتبطة به.",
                "تحميل الأسئلة"
            );

            return;
        }


        questions =
            questionData;


        /* =============================================
           ATTEMPT ID
        ============================================= */

        attemptId =
            crypto.randomUUID();


        /* =============================================
           DISPLAY
        ============================================= */

        examTitle.textContent =
            exam.title ||
            "اختبار";


        examDescription.textContent =
            exam.description ||
            "اختبار رياضيات";


        examGrade.textContent =
            "📚 " +
            (
                exam.grade ||
                "غير محدد"
            );


        const duration =
            Number(
                exam.duration_minutes ||
                exam.duration ||
                30
            );


        examDuration.textContent =
            "⏱ " +
            duration +
            " دقيقة";


        examQuestions.textContent =
            "📝 " +
            questions.length +
            " سؤال";


        renderQuestions();


        loading.style.display =
            "none";

        errorBox.style.display =
            "none";

        examBox.style.display =
            "block";


        startTimer(
            duration * 60
        );


    }catch(error){

        showError(
            error?.message ||
            String(error),
            "خطأ غير متوقع"
        );

    }

}


/* =====================================================
   RENDER QUESTIONS
===================================================== */

function renderQuestions(){

    questionsBox.innerHTML =
        "";


    questions.forEach(
        (question,index) => {

            const card =
                document.createElement("div");


            card.className =
                "card question";


            let optionsHTML =
                "";


            const list = [

                ["a",question.option_a],

                ["b",question.option_b],

                ["c",question.option_c],

                ["d",question.option_d]

            ];


            list.forEach(
                ([letter,value]) => {

                    if(
                        value !== null &&
                        value !== undefined &&
                        String(value).trim() !== ""
                    ){

                        const upper =
                            letter.toUpperCase();


                        optionsHTML += `

                            <label
                                class="option"
                                data-option="${letter}"
                            >

                                <input
                                    type="radio"
                                    name="question_${escapeHTML(question.id)}"
                                    value="${letter}"
                                >

                                <span class="option-letter">
                                    ${upper}
                                </span>

                                <span class="option-text">
                                    ${escapeHTML(value)}
                                </span>

                            </label>

                        `;

                    }

                }
            );


            card.innerHTML = `

                <div class="question-number">
                    السؤال ${index + 1}
                </div>

                <div class="question-text">
                    ${escapeHTML(
                        question.question_text
                    )}
                </div>

                <div class="options">
                    ${optionsHTML}
                </div>

            `;


            questionsBox.appendChild(
                card
            );

        }
    );


    /* =============================================
       SELECTED STYLE
    ============================================= */

    questionsBox
        .querySelectorAll(".option")
        .forEach(
            option => {

                option.addEventListener(
                    "click",
                    () => {

                        const parent =
                            option.parentElement;


                        parent
                            .querySelectorAll(
                                ".option"
                            )
                            .forEach(
                                item =>
                                    item.classList.remove(
                                        "selected"
                                    )
                            );


                        option.classList.add(
                            "selected"
                        );

                    }
                );

            }
        );

}


/* =====================================================
   GET STUDENT ANSWERS
===================================================== */

function getAnswers(){

    const answers = {};


    questions.forEach(
        question => {

            const selected =
                document.querySelector(
                    `input[name="question_${CSS.escape(String(question.id))}"]:checked`
                );


            answers[
                String(question.id)
            ] =
                selected
                ? normalizeAnswer(selected.value)
                : "";

        }
    );


    return answers;

}


/* =====================================================
   CALCULATE RESULT
===================================================== */

function calculateResult(){

    const answers =
        getAnswers();


    let score = 0;

    let totalPoints = 0;

    let correctCount = 0;

    let wrongCount = 0;


    questions.forEach(
        question => {

            const points =
                Number(question.points) || 1;


            totalPoints +=
                points;


            const studentAnswer =
                normalizeAnswer(
                    answers[
                        String(question.id)
                    ]
                );


            const correctAnswer =
                normalizeAnswer(
                    question.correct_answer
                );


            /*
             * الإجابة الصحيحة المفترضة:
             * a / b / c / d
             */

            if(
                studentAnswer &&
                studentAnswer === correctAnswer
            ){

                score +=
                    points;

                correctCount++;

            }else{

                wrongCount++;

            }

        }
    );


    const percentage =
        totalPoints > 0
        ? Math.round(
            (score / totalPoints) * 100
        )
        : 0;


    /*
     * النجاح هنا 50%.
     * لو عندك نسبة نجاح مختلفة نغيرها.
     */

    const passed =
        percentage >= 50;


    return {

        answers,

        score,

        totalPoints,

        percentage,

        passed,

        correctCount,

        wrongCount

    };

}


/* =====================================================
   SAVE RESULT
===================================================== */

async function saveResult(resultData){

    const {

        score,

        totalPoints,

        percentage,

        passed

    } =
    resultData;


    const payload = {

        exam_id:
            examId,

        student_id:
            currentUser.id,

        attempt_id:
            attemptId,

        score:
            score,

        total_points:
            totalPoints,

        percentage:
            percentage,

        passed:
            passed

    };


    console.log(
        "RESULT PAYLOAD:",
        payload
    );


    const {
        data,
        error
    } =
    await client
        .from("results")
        .insert(payload)
        .select()
        .single();


    if(error){

        throw new Error(
            "تعذر حفظ النتيجة في قاعدة البيانات.\n\n" +
            error.message +
            "\n\n" +
            "تفاصيل الخطأ:\n" +
            JSON.stringify(error,null,2)
        );

    }


    return data;

}


/* =====================================================
   SHOW RESULT
===================================================== */

function showResult(resultData){

    clearInterval(timer);


    examBox.style.display =
        "none";

    errorBox.style.display =
        "none";

    resultBox.style.display =
        "block";


    const {

        score,

        totalPoints,

        percentage,

        passed,

        correctCount,

        wrongCount

    } =
    resultData;


    const resultTitle =
        document.getElementById(
            "resultTitle"
        );


    const resultIcon =
        document.getElementById(
            "resultIcon"
        );


    resultBox.classList.remove(
        "success",
        "fail"
    );


    if(passed){

        resultBox.classList.add(
            "success"
        );

        resultIcon.textContent =
            "🏆";

        resultTitle.textContent =
            "مبروك! أنت ناجح 🎉";

    }else{

        resultBox.classList.add(
            "fail"
        );

        resultIcon.textContent =
            "📚";

        resultTitle.textContent =
            "لم تحقق درجة النجاح";

    }


    document.getElementById(
        "score"
    ).textContent =
        `${score} / ${totalPoints}`;


    document.getElementById(
        "percentage"
    ).textContent =
        `${percentage}%`;


    document.getElementById(
        "correctCount"
    ).textContent =
        correctCount;


    document.getElementById(
        "wrongCount"
    ).textContent =
        wrongCount;


    document.getElementById(
        "totalPoints"
    ).textContent =
        totalPoints;


    document.getElementById(
        "passed"
    ).textContent =
        passed
        ? "ناجح ✅"
        : "راسب ❌";

}


/* =====================================================
   SUBMIT EXAM
===================================================== */

async function submitExam(autoSubmit=false){

    if(submitting){

        return;

    }


    submitting =
        true;


    submitButton.disabled =
        true;


    try{

        if(timer){

            clearInterval(timer);

        }


        if(!autoSubmit){

            const confirmed =
                confirm(
                    "هل أنت متأكد من إنهاء الاختبار؟\n\nبعد الإنهاء سيتم تصحيح إجاباتك وحفظ النتيجة."
                );


            if(!confirmed){

                submitting =
                    false;

                submitButton.disabled =
                    false;

                startTimer(
                    secondsLeft
                );

                return;

            }

        }


        /* =============================================
           CALCULATE
        ============================================= */

        const resultData =
            calculateResult();


        /* =============================================
           SAVE
        ============================================= */

        await saveResult(
            resultData
        );


        /* =============================================
           SHOW
        ============================================= */

        showResult(
            resultData
        );


    }catch(error){

        submitting =
            false;

        submitButton.disabled =
            false;


        showError(
            error?.message ||
            String(error),
            "حفظ وتصحيح النتيجة"
        );

    }

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(seconds){

    clearInterval(timer);


    secondsLeft =
        Number(seconds) || 1800;


    updateTimer();


    timer =
        setInterval(
            () => {

                secondsLeft--;

                updateTimer();


                if(
                    secondsLeft <= 0
                ){

                    clearInterval(timer);

                    alert(
                        "⏰ انتهى وقت الاختبار.\nسيتم تصحيح إجاباتك وحفظ النتيجة."
                    );


                    submitExam(true);

                }

            },
            1000
        );

}


function updateTimer(){

    const minutes =
        Math.floor(
            secondsLeft / 60
        );


    const seconds =
        secondsLeft % 60;


    timeBox.textContent =
        String(minutes)
            .padStart(2,"0") +
        ":" +
        String(seconds)
            .padStart(2,"0");


    if(
        secondsLeft <= 60
    ){

        timerBox.classList.add(
            "warning"
        );

    }else{

        timerBox.classList.remove(
            "warning"
        );

    }

}


/* =====================================================
   SUBMIT BUTTON
===================================================== */

submitButton.addEventListener(
    "click",
    () => {

        submitExam(false);

    }
);


/* =====================================================
   RUN
===================================================== */

start();

</script>
