<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الاختبار | الخوارزمي</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 15% 10%,rgba(116,72,232,.25),transparent 35%),
        radial-gradient(circle at 90% 85%,rgba(49,84,223,.20),transparent 35%),
        #050509;
    color:#fff;
    padding:12px;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.logo{
    font-size:21px;
    font-weight:900;
}

.logo span{
    color:#805cff;
}

.back{
    color:#fff;
    text-decoration:none;
    background:#171722;
    border:1px solid rgba(255,255,255,.1);
    padding:9px 12px;
    border-radius:10px;
    white-space:nowrap;
}

.card{
    background:rgba(17,17,28,.94);
    border:1px solid rgba(140,100,255,.18);
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
}

.loading{
    text-align:center;
    padding:50px 15px;
    color:#bbb;
}

.loading-icon{
    font-size:35px;
    margin-bottom:15px;
}

.error{
    display:none;
    border-color:rgba(255,70,90,.4);
    background:rgba(80,15,25,.45);
}

.error-title{
    color:#ff6f7c;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.error-message{
    color:#ffd1d5;
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word;
    background:#170b0e;
    border:1px solid rgba(255,80,100,.2);
    border-radius:12px;
    padding:14px;
    font-size:14px;
}

.error-step{
    color:#aaa;
    margin-top:12px;
    font-size:13px;
}

.retry{
    width:100%;
    border:0;
    margin-top:15px;
    padding:13px;
    border-radius:12px;
    background:linear-gradient(135deg,#805cff,#3154df);
    color:#fff;
    font-weight:bold;
    font-size:15px;
}

.exam{
    display:none;
}

.exam-title{
    font-size:25px;
    margin-bottom:8px;
}

.description{
    color:#999;
    line-height:1.8;
}

.info{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.badge{
    background:#0b0b13;
    border:1px solid #29293b;
    padding:7px 10px;
    border-radius:9px;
    color:#bbb;
    font-size:13px;
}

.timer{
    position:sticky;
    top:8px;
    z-index:10;
    text-align:center;
    font-size:21px;
    font-weight:bold;
}

.timer.warning{
    color:#ff6f7c;
    border-color:rgba(255,70,90,.4);
}

.question{
    background:#0b0b13;
}

.question-number{
    color:#a98cff;
    font-weight:bold;
    margin-bottom:12px;
}

.question-text{
    font-size:17px;
    line-height:1.9;
    margin-bottom:15px;
}

.options{
    display:grid;
    gap:9px;
}

.option{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px;
    border:1px solid #29293b;
    background:#11111b;
    border-radius:11px;
}

.option input{
    width:18px;
    height:18px;
    accent-color:#805cff;
}

.submit{
    width:100%;
    border:0;
    padding:15px;
    border-radius:13px;
    background:linear-gradient(135deg,#805cff,#3154df);
    color:#fff;
    font-size:16px;
    font-weight:bold;
}

.debug{
    display:none;
    margin-top:15px;
    color:#777;
    font-size:11px;
    word-break:break-all;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            الخوارزمي <span>|</span> الاختبار
        </div>

        <a href="tests.html" class="back">
            ← الاختبارات
        </a>

    </div>


    <!-- LOADING -->

    <div id="loading" class="card loading">

        <div class="loading-icon">
            ⏳
        </div>

        <div>
            جاري تحميل الاختبار...
        </div>

    </div>


    <!-- ERROR -->

    <div id="errorBox" class="card error">

        <div class="error-title">
            ⚠️ حدث خطأ في تحميل الاختبار
        </div>

        <div
            id="errorMessage"
            class="error-message">
        </div>

        <div
            id="errorStep"
            class="error-step">
        </div>

        <button
            class="retry"
            onclick="location.reload()">

            🔄 إعادة المحاولة

        </button>

        <div
            id="debug"
            class="debug">
        </div>

    </div>


    <!-- EXAM -->

    <div id="exam" class="exam">

        <div class="card">

            <h1
                id="examTitle"
                class="exam-title">
            </h1>

            <div
                id="examDescription"
                class="description">
            </div>

            <div class="info">

                <span
                    id="examGrade"
                    class="badge">
                </span>

                <span
                    id="examDuration"
                    class="badge">
                </span>

                <span
                    id="examQuestions"
                    class="badge">
                </span>

            </div>

        </div>


        <div
            id="timer"
            class="card timer">

            ⏱
            <span id="time">
                00:00
            </span>

        </div>


        <div id="questions"></div>


        <div class="card">

            <button
                id="submit"
                class="submit">

                إنهاء الاختبار

            </button>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("errorBox");

const errorMessage =
    document.getElementById("errorMessage");

const errorStep =
    document.getElementById("errorStep");

const debugBox =
    document.getElementById("debug");

const examBox =
    document.getElementById("exam");

const examTitle =
    document.getElementById("examTitle");

const examDescription =
    document.getElementById("examDescription");

const examGrade =
    document.getElementById("examGrade");

const examDuration =
    document.getElementById("examDuration");

const examQuestions =
    document.getElementById("examQuestions");

const questionsBox =
    document.getElementById("questions");

const timerBox =
    document.getElementById("timer");

const timeBox =
    document.getElementById("time");


/* =====================================================
   STATE
===================================================== */

let client = null;

let examId = null;

let currentExam = null;

let questions = [];

let timer = null;

let secondsLeft = 0;


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(
    message,
    step = ""
){

    console.error(
        "EXAM ERROR:",
        message
    );

    loading.style.display =
        "none";

    examBox.style.display =
        "none";

    errorBox.style.display =
        "block";

    errorMessage.textContent =
        message;

    errorStep.textContent =
        step
        ? "📍 المرحلة: " + step
        : "";

    debugBox.textContent =
        "URL: " +
        window.location.href;

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   START
===================================================== */

async function start(){

    try{

        /* =============================================
           1
        ============================================= */

        client =
            window.supabaseClient;


        if(!client){

            showError(
                "لم يتم إنشاء اتصال Supabase.",
                "الاتصال بقاعدة البيانات"
            );

            return;
        }


        /* =============================================
           2
        ============================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );

        examId =
            params.get("id");


        if(!examId){

            showError(
                "معرف الاختبار غير موجود في الرابط.\n\nافتح الاختبار من صفحة الاختبارات واضغط «بدء الاختبار».",
                "قراءة رابط الاختبار"
            );

            return;
        }


        /* =============================================
           3
        ============================================= */

        const {
            data:userData,
            error:userError
        } =
        await client.auth.getUser();


        if(userError){

            showError(
                "تعذر التحقق من تسجيل الدخول.\n\n" +
                userError.message,
                "التحقق من الطالب"
            );

            return;
        }


        if(!userData?.user){

            showError(
                "أنت غير مسجل الدخول.\n\nسيتم تحويلك إلى صفحة تسجيل الدخول.",
                "تسجيل الدخول"
            );

            setTimeout(
                () => {
                    location.href =
                        "auth.html";
                },
                1500
            );

            return;
        }


        /* =============================================
           4 - EXAM
        ============================================= */

        const {
            data:exam,
            error:examError
        } =
        await client
            .from("exams")
            .select("*")
            .eq("id",examId)
            .maybeSingle();


        if(examError){

            showError(
                "تعذر قراءة الاختبار من قاعدة البيانات.\n\n" +
                examError.message,
                "قراءة جدول exams"
            );

            return;
        }


        if(!exam){

            showError(
                "الاختبار غير موجود.\n\nمعرف الاختبار:\n" +
                examId,
                "البحث عن الاختبار"
            );

            return;
        }


        if(
            exam.is_active === false
        ){

            showError(
                "هذا الاختبار غير متاح حاليًا.",
                "حالة الاختبار"
            );

            return;
        }


        currentExam =
            exam;


        /* =============================================
           5 - QUESTIONS
        ============================================= */

        const {
            data:questionData,
            error:questionError
        } =
        await client
            .from("questions")
            .select("*")
            .eq(
                "exam_id",
                examId
            )
            .order(
                "question_order",
                {
                    ascending:true
                }
            );


        if(questionError){

            showError(
                "تم العثور على الاختبار، لكن تعذر تحميل الأسئلة.\n\n" +
                questionError.message,
                "قراءة جدول questions"
            );

            return;
        }


        if(
            !questionData ||
            questionData.length === 0
        ){

            showError(
                "الاختبار موجود، لكن لا توجد أسئلة مرتبطة به.",
                "تحميل الأسئلة"
            );

            return;
        }


        questions =
            questionData;


        /* =============================================
           6 - DISPLAY
        ============================================= */

        examTitle.textContent =
            exam.title ||
            "اختبار";


        examDescription.textContent =
            exam.description ||
            "اختبار رياضيات";


        examGrade.textContent =
            "📚 " +
            (
                exam.grade ||
                "غير محدد"
            );


        const duration =
            Number(
                exam.duration_minutes ||
                exam.duration ||
                30
            );


        examDuration.textContent =
            "⏱ " +
            duration +
            " دقيقة";


        examQuestions.textContent =
            "📝 " +
            questions.length +
            " سؤال";


        renderQuestions();


        loading.style.display =
            "none";

        errorBox.style.display =
            "none";

        examBox.style.display =
            "block";


        startTimer(
            duration * 60
        );

    }catch(error){

        showError(
            error?.message ||
            String(error),
            "خطأ غير متوقع"
        );

    }

}


/* =====================================================
   QUESTIONS
===================================================== */

function renderQuestions(){

    questionsBox.innerHTML =
        "";


    questions.forEach(
        (question,index) => {

            const card =
                document.createElement("div");

            card.className =
                "card question";


            let options = "";


            const list = [
                ["a",question.option_a],
                ["b",question.option_b],
                ["c",question.option_c],
                ["d",question.option_d]
            ];


            list.forEach(
                ([letter,value]) => {

                    if(
                        value !== null &&
                        value !== undefined &&
                        String(value).trim() !== ""
                    ){

                        options += `

                            <label class="option">

                                <input
                                    type="radio"
                                    name="question_${escapeHTML(question.id)}"
                                    value="${letter}">

                                <span>
                                    ${escapeHTML(value)}
                                </span>

                            </label>

                        `;

                    }

                }
            );


            card.innerHTML = `

                <div class="question-number">
                    السؤال ${index + 1}
                </div>

                <div class="question-text">
                    ${escapeHTML(
                        question.question_text
                    )}
                </div>

                <div class="options">
                    ${options}
                </div>

            `;


            questionsBox.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(seconds){

    secondsLeft =
        Number(seconds) || 1800;


    updateTimer();


    timer =
        setInterval(
            () => {

                secondsLeft--;

                updateTimer();


                if(
                    secondsLeft <= 0
                ){

                    clearInterval(timer);

                    alert(
                        "انتهى وقت الاختبار."
                    );

                }

            },
            1000
        );

}


function updateTimer(){

    const minutes =
        Math.floor(
            secondsLeft / 60
        );

    const seconds =
        secondsLeft % 60;


    timeBox.textContent =
        String(minutes)
            .padStart(2,"0") +
        ":" +
        String(seconds)
            .padStart(2,"0");


    if(
        secondsLeft <= 60
    ){

        timerBox.classList.add(
            "warning"
        );

    }

}


/* =====================================================
   SUBMIT
===================================================== */

document
    .getElementById("submit")
    .addEventListener(
        "click",
        () => {

            alert(
                "تم استلام طلب إنهاء الاختبار.\nسيتم ربط حفظ النتيجة بعد التأكد من تحميل الاختبار والأسئلة."
            );

        }
    );


/* =====================================================
   RUN
===================================================== */

start();

</script>

</body>
</html>
