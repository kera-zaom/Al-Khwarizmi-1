<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الخوارزمي | إنشاء اختبار</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at 20% 20%,rgba(125,82,255,.20),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(49,84,223,.16),transparent 35%),
        #06060a;
}

.container{
    width:min(1100px,94%);
    margin:auto;
    padding:30px 0 70px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.logo{
    font-size:27px;
    font-weight:900;
}

.logo span{
    color:#805cff;
}

.back{
    background:#15151d;
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
    padding:11px 18px;
    border-radius:12px;
    cursor:pointer;
}

h1{
    font-size:32px;
    margin-bottom:8px;
}

.subtitle{
    color:#999;
    margin-bottom:25px;
}

.card{
    background:rgba(16,16,23,.9);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:25px;
    margin-bottom:20px;
}

.modes{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.mode{
    background:#101017;
    color:#fff;
    border:1px solid rgba(255,255,255,.1);
    border-radius:17px;
    padding:20px;
    text-align:right;
    cursor:pointer;
}

.mode.active{
    border-color:#805cff;
    background:rgba(128,92,255,.16);
}

.mode strong{
    display:block;
    font-size:19px;
    margin-bottom:7px;
}

.mode small{
    color:#999;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    margin-bottom:8px;
    color:#ddd;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    background:#0b0b10;
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
    border-radius:12px;
    padding:13px;
    outline:none;
    font-size:15px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#805cff;
}

.actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:20px;
}

.btn{
    border:0;
    color:#fff;
    padding:13px 22px;
    border-radius:13px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

.primary{
    background:linear-gradient(135deg,#805cff,#4d61e8);
}

.secondary{
    background:#20202a;
}

.ai-box,
.manual-box{
    display:none;
}

.ai-box.show,
.manual-box.show{
    display:block;
}

.question{
    background:#0b0b10;
    border:1px solid rgba(255,255,255,.08);
    padding:20px;
    border-radius:18px;
    margin-bottom:18px;
}

.question-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.question-title{
    color:#aa8cff;
    font-weight:bold;
}

.delete{
    background:#44151b;
    border:0;
    color:#ff9ca5;
    border-radius:9px;
    padding:8px 12px;
    cursor:pointer;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:15px;
}

.status{
    display:none;
    padding:15px;
    border-radius:13px;
    margin-top:20px;
}

.status.show{
    display:block;
}

.status.success{
    background:rgba(30,190,110,.1);
    border:1px solid rgba(30,190,110,.25);
    color:#8af0bb;
}

.status.error{
    background:rgba(255,50,70,.1);
    border:1px solid rgba(255,50,70,.25);
    color:#ff9da7;
}

.status.loading{
    background:rgba(128,92,255,.1);
    border:1px solid rgba(128,92,255,.25);
    color:#c8baff;
}

@media(max-width:700px){

    .modes,
    .grid,
    .options{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    h1{
        font-size:26px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            الخوارزمي <span>|</span> الإدارة
        </div>

        <button class="back" onclick="goBack()">
            ← رجوع
        </button>

    </div>

    <h1>إنشاء اختبار</h1>

    <p class="subtitle">
        أنشئ اختبارًا يدويًا أو استخدم الذكاء الاصطناعي لإنشائه تلقائيًا.
    </p>


    <!-- نوع الاختبار -->

    <div class="card">

        <div class="modes">

            <button
                id="manualMode"
                class="mode active"
                onclick="setMode('manual')">

                <strong>📝 اختبار يدوي</strong>

                <small>
                    أضف الأسئلة والاختيارات بنفسك.
                </small>

            </button>


            <button
                id="aiMode"
                class="mode"
                onclick="setMode('ai')">

                <strong>🤖 اختبار AI</strong>

                <small>
                    الذكاء الاصطناعي ينشئ الأسئلة تلقائيًا.
                </small>

            </button>

        </div>

    </div>


    <!-- بيانات الاختبار -->

    <div class="card">

        <div class="grid">

            <div>
                <label>اسم الاختبار</label>

                <input
                    id="title"
                    type="text"
                    placeholder="مثال: اختبار الجبر">
            </div>


            <div>
                <label>كود الاختبار</label>

                <input
                    id="examCode"
                    type="text"
                    placeholder="مثال: ALG101">
            </div>


            <div>
                <label>الصف</label>

                <select id="grade">

                    <option value="">
                        اختر الصف
                    </option>

                    <option>أولى إعدادي</option>
                    <option>ثانية إعدادي</option>
                    <option>ثالثة إعدادي</option>

                    <option>أولى ثانوي</option>
                    <option>ثانية ثانوي</option>
                    <option>ثالثة ثانوي</option>

                </select>
            </div>


            <div>
                <label>مدة الاختبار بالدقائق</label>

                <input
                    id="duration"
                    type="number"
                    value="30"
                    min="1">
            </div>


            <div class="full">

                <label>وصف الاختبار</label>

                <textarea
                    id="description"
                    placeholder="وصف مختصر للاختبار"></textarea>

            </div>

        </div>

    </div>


    <!-- AI -->

    <div
        id="aiBox"
        class="card ai-box">

        <h2 style="margin-bottom:20px">
            🤖 إعداد اختبار AI
        </h2>

        <div class="grid">

            <div>

                <label>عدد الأسئلة</label>

                <input
                    id="questionCount"
                    type="number"
                    min="1"
                    max="100"
                    value="10">

            </div>


            <div>

                <label>المستوى</label>

                <select id="level">

                    <option value="easy">
                        سهل
                    </option>

                    <option value="medium" selected>
                        متوسط
                    </option>

                    <option value="hard">
                        صعب
                    </option>

                </select>

            </div>


            <div class="full">

                <label>موضوع الأسئلة</label>

                <input
                    id="topic"
                    type="text"
                    placeholder="مثال: المعادلات من الدرجة الأولى">

            </div>

        </div>

        <div class="actions">

            <button
                class="btn primary"
                onclick="generateAI()">

                🤖 إنشاء الاختبار بالـAI

            </button>

        </div>

    </div>


    <!-- MANUAL -->

    <div
        id="manualBox"
        class="card manual-box show">

        <h2 style="margin-bottom:20px">
            📝 أسئلة الاختبار
        </h2>

        <div id="questions"></div>

        <div class="actions">

            <button
                class="btn secondary"
                onclick="addQuestion()">

                + إضافة سؤال

            </button>

            <button
                class="btn primary"
                onclick="saveManual()">

                💾 حفظ الاختبار

            </button>

        </div>

    </div>


    <div
        id="status"
        class="status">
    </div>

</div>


<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
    "https://fdqolsygigqukejlwcon.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_fO1Xb-dtqq8rnGuvXcPahg_zz9WeW9x";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   STATE
===================================================== */

let mode = "manual";

let questionNumber = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const aiBox =
    document.getElementById("aiBox");

const manualBox =
    document.getElementById("manualBox");

const questions =
    document.getElementById("questions");

const statusBox =
    document.getElementById("status");


/* =====================================================
   MODE
===================================================== */

function setMode(value){

    mode = value;

    document
        .getElementById("manualMode")
        .classList.toggle(
            "active",
            value === "manual"
        );

    document
        .getElementById("aiMode")
        .classList.toggle(
            "active",
            value === "ai"
        );

    manualBox.classList.toggle(
        "show",
        value === "manual"
    );

    aiBox.classList.toggle(
        "show",
        value === "ai"
    );

}


/* =====================================================
   STATUS
===================================================== */

function status(message,type){

    statusBox.className =
        "status show " + type;

    statusBox.innerHTML =
        message;

}


/* =====================================================
   ADD QUESTION
===================================================== */

function addQuestion(data = {}){

    questionNumber++;

    const n =
        questionNumber;

    const html = `

        <div
            class="question"
            id="q-${n}">

            <div class="question-head">

                <div class="question-title">
                    السؤال ${n}
                </div>

                <button
                    class="delete"
                    onclick="removeQuestion(${n})">

                    حذف

                </button>

            </div>


            <label>
                نص السؤال
            </label>

            <textarea
                class="q-text"
                placeholder="اكتب السؤال">${data.question_text || ""}</textarea>


            <div class="options">

                <div>

                    <label>A</label>

                    <input
                        class="q-a"
                        value="${data.option_a || ""}"
                        placeholder="الاختيار A">

                </div>


                <div>

                    <label>B</label>

                    <input
                        class="q-b"
                        value="${data.option_b || ""}"
                        placeholder="الاختيار B">

                </div>


                <div>

                    <label>C</label>

                    <input
                        class="q-c"
                        value="${data.option_c || ""}"
                        placeholder="الاختيار C">

                </div>


                <div>

                    <label>D</label>

                    <input
                        class="q-d"
                        value="${data.option_d || ""}"
                        placeholder="الاختيار D">

                </div>

            </div>


            <div class="grid" style="margin-top:15px">

                <div>

                    <label>
                        الإجابة الصحيحة
                    </label>

                    <select class="q-answer">

                        <option value="">
                            اختر
                        </option>

                        <option value="a"
                            ${data.correct_answer === "a" ? "selected" : ""}>
                            A
                        </option>

                        <option value="b"
                            ${data.correct_answer === "b" ? "selected" : ""}>
                            B
                        </option>

                        <option value="c"
                            ${data.correct_answer === "c" ? "selected" : ""}>
                            C
                        </option>

                        <option value="d"
                            ${data.correct_answer === "d" ? "selected" : ""}>
                            D
                        </option>

                    </select>

                </div>


                <div>

                    <label>
                        الدرجة
                    </label>

                    <input
                        class="q-points"
                        type="number"
                        min="1"
                        value="${data.points || 1}">

                </div>

            </div>

        </div>
    `;

    questions.insertAdjacentHTML(
        "beforeend",
        html
    );

}


/* =====================================================
   REMOVE
===================================================== */

function removeQuestion(n){

    const el =
        document.getElementById(
            "q-" + n
        );

    if(el){
        el.remove();
    }

}


/* =====================================================
   COLLECT QUESTIONS
===================================================== */

function collectQuestions(){

    const cards =
        document.querySelectorAll(
            ".question"
        );

    return [...cards].map(
        (card,index) => {

            return {

                question_text:
                    card
                        .querySelector(".q-text")
                        .value.trim(),

                question_type:
                    "multiple_choice",

                option_a:
                    card
                        .querySelector(".q-a")
                        .value.trim(),

                option_b:
                    card
                        .querySelector(".q-b")
                        .value.trim(),

                option_c:
                    card
                        .querySelector(".q-c")
                        .value.trim(),

                option_d:
                    card
                        .querySelector(".q-d")
                        .value.trim(),

                correct_answer:
                    card
                        .querySelector(".q-answer")
                        .value,

                points:
                    Number(
                        card
                            .querySelector(".q-points")
                            .value
                    ) || 1,

                question_order:
                    index + 1,

                level:
                    "medium"

            };

        }
    );

}


/* =====================================================
   GET EXAM DATA
===================================================== */

function getExam(){

    return {

        title:
            document
                .getElementById("title")
                .value.trim(),

        exam_code:
            document
                .getElementById("examCode")
                .value.trim(),

        grade:
            document
                .getElementById("grade")
                .value,

        description:
            document
                .getElementById("description")
                .value.trim(),

        duration:
            Number(
                document
                    .getElementById("duration")
                    .value
            ) || 30

    };

}


/* =====================================================
   MANUAL SAVE
===================================================== */

async function saveManual(){

    const exam =
        getExam();

    const qs =
        collectQuestions();


    if(!exam.title){

        status(
            "اكتب اسم الاختبار.",
            "error"
        );

        return;
    }


    if(!exam.grade){

        status(
            "اختر الصف.",
            "error"
        );

        return;
    }


    if(qs.length === 0){

        status(
            "أضف سؤالًا واحدًا على الأقل.",
            "error"
        );

        return;
    }


    for(
        let i = 0;
        i < qs.length;
        i++
    ){

        const q = qs[i];

        if(!q.question_text){

            status(
                `اكتب نص السؤال رقم ${i+1}.`,
                "error"
            );

            return;
        }

        if(
            !q.option_a ||
            !q.option_b ||
            !q.option_c ||
            !q.option_d
        ){

            status(
                `أكمل اختيارات السؤال رقم ${i+1}.`,
                "error"
            );

            return;
        }

        if(!q.correct_answer){

            status(
                `حدد إجابة السؤال رقم ${i+1}.`,
                "error"
            );

            return;
        }

    }


    status(
        "⏳ جاري حفظ الاختبار...",
        "loading"
    );


    try{

        const {
            data:{
                user
            },
            error
        } =
        await supabaseClient
            .auth
            .getUser();


        if(error || !user){

            throw new Error(
                "يجب تسجيل الدخول أولًا."
            );

        }


        const {
            data:examRow,
            error:examError
        } =
        await supabaseClient
            .from("exams")
            .insert({

                title:
                    exam.title,

                description:
                    exam.description || null,

                duration:
                    exam.duration,

                duration_minutes:
                    exam.duration,

                exam_type:
                    "manual",

                grade:
                    exam.grade,

                subject:
                    "رياضيات",

                exam_code:
                    exam.exam_code || null,

                is_active:
                    true,

                created_by:
                    user.id,

                total_points:
                    qs.reduce(
                        (sum,q) =>
                            sum + q.points,
                        0
                    )

            })
            .select()
            .single();


        if(examError){

            throw examError;

        }


        const rows =
            qs.map(q => ({

                exam_id:
                    examRow.id,

                question_text:
                    q.question_text,

                question_type:
                    q.question_type,

                option_a:
                    q.option_a,

                option_b:
                    q.option_b,

                option_c:
                    q.option_c,

                option_d:
                    q.option_d,

                correct_answer:
                    q.correct_answer,

                points:
                    q.points,

                question_order:
                    q.question_order,

                level:
                    q.level

            }));


        const {
            error:questionError
        } =
        await supabaseClient
            .from("questions")
            .insert(rows);


        if(questionError){

            await supabaseClient
                .from("exams")
                .delete()
                .eq(
                    "id",
                    examRow.id
                );

            throw questionError;

        }


        status(
            "تم إنشاء الاختبار اليدوي بنجاح ✅",
            "success"
        );


        setTimeout(
            () => {
                location.href =
                    "exams.html";
            },
            1200
        );


    }catch(error){

        console.error(error);

        status(
            "حدث خطأ: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   AI
===================================================== */

async function generateAI(){

    const exam =
        getExam();

    const topic =
        document
            .getElementById("topic")
            .value.trim();

    const count =
        Number(
            document
                .getElementById("questionCount")
                .value
        );

    const level =
        document
            .getElementById("level")
            .value;


    if(!exam.title){

        status(
            "اكتب اسم الاختبار.",
            "error"
        );

        return;
    }


    if(!exam.grade){

        status(
            "اختر الصف.",
            "error"
        );

        return;
    }


    if(!topic){

        status(
            "اكتب موضوع الاختبار.",
            "error"
        );

        return;
    }


    if(
        !count ||
        count < 1 ||
        count > 100
    ){

        status(
            "عدد الأسئلة يجب أن يكون من 1 إلى 100.",
            "error"
        );

        return;
    }


    status(
        "🤖 جاري إنشاء الأسئلة بالذكاء الاصطناعي...",
        "loading"
    );


    try{

        const {
            data:{
                session
            },
            error:sessionError
        } =
        await supabaseClient
            .auth
            .getSession();


        if(
            sessionError ||
            !session
        ){

            throw new Error(
                "يجب تسجيل الدخول أولًا."
            );

        }


        const {
            data,
            error
        } =
        await supabaseClient
            .functions
            .invoke(
                "generate-exam",
                {

                    body: {

                        title:
                            exam.title,

                        description:
                            exam.description,

                        exam_code:
                            exam.exam_code,

                        grade:
                            exam.grade,

                        subject:
                            "رياضيات",

                        duration:
                            exam.duration,

                        questionCount:
                            count,

                        level:
                            level,

                        topic:
                            topic

                    }

                }
            );


        if(error){

            throw error;

        }


        if(
            !data ||
            data.success !== true
        ){

            throw new Error(
                data?.error ||
                "فشل إنشاء الاختبار."
            );

        }


        status(
            `تم إنشاء اختبار AI بنجاح ✅<br>
             عدد الأسئلة: ${data.questions?.length || count}`,
            "success"
        );


        setTimeout(
            () => {
                location.href =
                    "exams.html";
            },
            1500
        );


    }catch(error){

        console.error(
            "AI ERROR:",
            error
        );

        status(
            "خطأ في إنشاء اختبار AI:<br>" +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   AUTH
===================================================== */

async function checkAuth(){

    const {
        data:{
            user
        }
    } =
    await supabaseClient
        .auth
        .getUser();


    if(!user){

        location.href =
            "login.html";

    }

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    location.href =
        "index.html";

}


/* =====================================================
   START
===================================================== */

addQuestion();

checkAuth();

</script>

</body>
</html>
