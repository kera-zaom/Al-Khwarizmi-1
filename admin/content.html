<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>الخوارزمي | إدارة المحتوى</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{

    min-height:100vh;

    background:
    radial-gradient(
        circle at 10% 10%,
        rgba(116,72,232,.18),
        transparent 30%
    ),

    radial-gradient(
        circle at 90% 80%,
        rgba(49,84,223,.14),
        transparent 32%
    ),

    #050509;

    color:#fff;
}

button,
input,
select{
    font-family:inherit;
}

#loadingScreen{

    position:fixed;
    inset:0;

    z-index:99999;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:18px;

    background:#050509;
}

.loader{

    width:55px;
    height:55px;

    border-radius:50%;

    border:4px solid
    rgba(255,255,255,.08);

    border-top-color:#7952ed;

    animation:spin 1s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}

#loadingText{
    color:#aaa;
}

#adminApp{
    display:none;
}

header{

    height:70px;

    position:sticky;
    top:0;

    z-index:1000;

    background:
    rgba(5,5,9,.86);

    backdrop-filter:blur(18px);

    border-bottom:
    1px solid
    rgba(255,255,255,.07);
}

.header-inner{

    width:min(1200px,94%);

    height:70px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.logo{

    font-size:23px;
    font-weight:900;

    background:
    linear-gradient(
        90deg,
        #fff,
        #9b7cff
    );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.header-actions{

    display:flex;
    gap:10px;
}

.back-btn,
.logout-btn{

    padding:9px 14px;

    border-radius:11px;

    color:#fff;

    text-decoration:none;

    border:
    1px solid
    rgba(255,255,255,.08);

    background:
    rgba(255,255,255,.06);

    cursor:pointer;
}

.logout-btn{

    background:
    rgba(255,60,80,.08);
}

.container{

    width:min(1100px,94%);
    margin:auto;
}

.page-top{

    padding:40px 0 25px;
}

.page-top h1{

    font-size:
    clamp(28px,5vw,42px);

    margin-bottom:10px;
}

.page-top p{

    color:#888;
    line-height:1.8;
}

.tabs{

    display:flex;

    gap:10px;

    margin-bottom:20px;
}

.tab{

    border:1px solid
    rgba(255,255,255,.08);

    background:
    rgba(255,255,255,.04);

    color:#aaa;

    padding:12px 22px;

    border-radius:12px;

    cursor:pointer;
}

.tab.active{

    color:#fff;

    background:
    linear-gradient(
        135deg,
        #7448e8,
        #3154df
    );
}

.card{

    padding:25px;

    border-radius:22px;

    background:
    rgba(255,255,255,.035);

    border:
    1px solid
    rgba(255,255,255,.08);

    margin-bottom:25px;
}

.form-group{

    margin-bottom:17px;
}

label{

    display:block;

    margin-bottom:8px;

    color:#bbb;

    font-size:13px;
}

input,
select{

    width:100%;

    padding:14px;

    border-radius:12px;

    outline:none;

    border:
    1px solid #29293a;

    background:#090910;

    color:#fff;
}

input:focus,
select:focus{

    border-color:#7448e8;
}

.file-input{

    padding:12px;
}

.primary-btn{

    width:100%;

    border:0;

    padding:14px;

    border-radius:13px;

    color:#fff;

    cursor:pointer;

    font-weight:bold;

    background:
    linear-gradient(
        135deg,
        #7448e8,
        #3154df
    );
}

.primary-btn:disabled{

    opacity:.5;
    cursor:not-allowed;
}

.message{

    display:none;

    padding:14px;

    border-radius:12px;

    margin-bottom:18px;

    text-align:center;

    line-height:1.7;
}

.message.success{

    display:block;

    color:#63ffb0;

    background:
    rgba(40,200,120,.08);
}

.message.error{

    display:block;

    color:#ff7e8a;

    background:
    rgba(255,60,80,.08);
}

.info{

    color:#777;

    font-size:12px;

    line-height:1.8;

    margin-top:10px;
}

footer{

    padding:30px;

    text-align:center;

    color:#666;

    border-top:
    1px solid
    rgba(255,255,255,.06);
}

footer span{
    color:#9b7cff;
}

</style>

</head>

<body>


<div id="loadingScreen">

<div class="loader"></div>

<div id="loadingText">
جاري التحقق من صلاحيات الأدمن...
</div>

</div>


<div id="adminApp">

<header>

<div class="header-inner">

<div class="logo">
الخوارزمي
</div>

<div class="header-actions">

<a
    href="index.html"
    class="back-btn"
>
لوحة الإدارة
</a>

<button
    id="logoutBtn"
    class="logout-btn"
>
خروج
</button>

</div>

</div>

</header>


<main>

<div class="container">

<section class="page-top">

<h1>
إدارة المحتوى 📚
</h1>

<p>
إضافة ملفات PDF وفيديوهات للطلاب من لوحة الإدارة.
</p>

</section>


<div
    id="message"
    class="message"
></div>


<div class="tabs">

<button
    id="pdfTab"
    class="tab active"
>
📄 PDF
</button>

<button
    id="videoTab"
    class="tab"
>
🎬 فيديو
</button>

</div>


<div
    id="pdfSection"
    class="card"
>

<h2 style="margin-bottom:20px">
إضافة ملف PDF
</h2>

<div class="form-group">

<label>
اسم الملف
</label>

<input
    id="pdfTitle"
    type="text"
    placeholder="مثال: مراجعة الجبر"
/>

</div>


<div class="form-group">

<label>
الصف الدراسي
</label>

<select id="pdfGrade">

<option value="">
اختر الصف
</option>

<option>أولى إعدادي</option>
<option>ثانية إعدادي</option>
<option>ثالثة إعدادي</option>
<option>أولى ثانوي</option>
<option>ثانية ثانوي</option>
<option>ثالثة ثانوي</option>

</select>

</div>


<div class="form-group">

<label>
ملف PDF
</label>

<input
    id="pdfFile"
    class="file-input"
    type="file"
    accept="application/pdf"
/>

</div>


<button
    id="uploadPdfBtn"
    class="primary-btn"
>
رفع PDF
</button>

<div class="info">
سيتم رفع الملف إلى Supabase Storage.
</div>

</div>


<div
    id="videoSection"
    class="card"
    style="display:none"
>

<h2 style="margin-bottom:20px">
إضافة فيديو
</h2>

<div class="form-group">

<label>
عنوان الفيديو
</label>

<input
    id="videoTitle"
    type="text"
    placeholder="مثال: شرح الدرس الأول"
/>

</div>


<div class="form-group">

<label>
الصف الدراسي
</label>

<select id="videoGrade">

<option value="">
اختر الصف
</option>

<option>أولى إعدادي</option>
<option>ثانية إعدادي</option>
<option>ثالثة إعدادي</option>
<option>أولى ثانوي</option>
<option>ثانية ثانوي</option>
<option>ثالثة ثانوي</option>

</select>

</div>


<div class="form-group">

<label>
رابط YouTube
</label>

<input
    id="videoUrl"
    type="url"
    placeholder="https://www.youtube.com/watch?v=..."
/>

</div>


<button
    id="addVideoBtn"
    class="primary-btn"
>
إضافة الفيديو
</button>

</div>

</div>

</main>


<footer>

© 2026 منصة
<span>الخوارزمي</span>
— إدارة المحتوى

</footer>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase.js"></script>

<script src="admin-auth.js"></script>


<script>

"use strict";

let client = null;


const loadingScreen =
    document.getElementById(
        "loadingScreen"
    );

const adminApp =
    document.getElementById(
        "adminApp"
    );

const message =
    document.getElementById(
        "message"
    );


function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " + type;

}


document
    .getElementById("pdfTab")
    .addEventListener(
        "click",
        function(){

            this.classList.add("active");

            document
                .getElementById("videoTab")
                .classList.remove("active");

            document
                .getElementById("pdfSection")
                .style.display =
                "block";

            document
                .getElementById("videoSection")
                .style.display =
                "none";
        }
    );


document
    .getElementById("videoTab")
    .addEventListener(
        "click",
        function(){

            this.classList.add("active");

            document
                .getElementById("pdfTab")
                .classList.remove("active");

            document
                .getElementById("pdfSection")
                .style.display =
                "none";

            document
                .getElementById("videoSection")
                .style.display =
                "block";
        }
    );


/*
=====================================================
 ADD VIDEO
=====================================================
*/

document
    .getElementById("addVideoBtn")
    .addEventListener(
        "click",
        async function(){

            const btn = this;

            const title =
                document
                    .getElementById("videoTitle")
                    .value
                    .trim();

            const grade =
                document
                    .getElementById("videoGrade")
                    .value;

            const url =
                document
                    .getElementById("videoUrl")
                    .value
                    .trim();


            if(!title){

                showMessage(
                    "اكتب اسم الفيديو.",
                    "error"
                );

                return;
            }


            if(!grade){

                showMessage(
                    "اختر الصف الدراسي.",
                    "error"
                );

                return;
            }


            if(!url){

                showMessage(
                    "أدخل رابط الفيديو.",
                    "error"
                );

                return;
            }


            btn.disabled = true;

            btn.textContent =
                "جاري الإضافة...";


            try{

                /*
                غيّر اسم الجدول إذا كان
                جدول الفيديوهات عندك باسم مختلف.
                */

                const {
                    error
                } = await client
                    .from("videos")
                    .insert({

                        title: title,

                        grade: grade,

                        video_url: url,

                        created_by:
                            ADMIN_AUTH.user.id

                    });


                if(error){
                    throw error;
                }


                document
                    .getElementById("videoTitle")
                    .value = "";

                document
                    .getElementById("videoGrade")
                    .value = "";

                document
                    .getElementById("videoUrl")
                    .value = "";


                showMessage(
                    "تم إضافة الفيديو بنجاح ✅",
                    "success"
                );

            }
            catch(error){

                console.error(
                    "VIDEO ERROR:",
                    error
                );

                showMessage(
                    "فشل إضافة الفيديو: " +
                    error.message,
                    "error"
                );

            }
            finally{

                btn.disabled = false;

                btn.textContent =
                    "إضافة الفيديو";
            }

        }
    );


/*
=====================================================
 ADD PDF
=====================================================
*/

document
    .getElementById("uploadPdfBtn")
    .addEventListener(
        "click",
        async function(){

            const btn = this;


            const title =
                document
                    .getElementById("pdfTitle")
                    .value
                    .trim();


            const grade =
                document
                    .getElementById("pdfGrade")
                    .value;


            const file =
                document
                    .getElementById("pdfFile")
                    .files[0];


            if(!title){

                showMessage(
                    "اكتب اسم ملف PDF.",
                    "error"
                );

                return;
            }


            if(!grade){

                showMessage(
                    "اختر الصف الدراسي.",
                    "error"
                );

                return;
            }


            if(!file){

                showMessage(
                    "اختر ملف PDF.",
                    "error"
                );

                return;
            }


            if(
                file.type !==
                "application/pdf"
            ){

                showMessage(
                    "الملف يجب أن يكون PDF.",
                    "error"
                );

                return;
            }


            btn.disabled = true;

            btn.textContent =
                "جاري رفع PDF...";


            try{

                const fileName =
                    Date.now() +
                    "-" +
                    file.name
                        .replace(
                            /[^a-zA-Z0-9._-]/g,
                            "_"
                        );


                /*
                اسم Storage Bucket:
                content
                */

                const {
                    error:
                    uploadError
                } =
                    await client
                        .storage
                        .from("content")
                        .upload(
                            "pdf/" + fileName,
                            file,
                            {
                                contentType:
                                    "application/pdf",
                                upsert:false
                            }
                        );


                if(uploadError){
                    throw uploadError;
                }


                const {
                    data:
                    publicData
                } =
                    client
                        .storage
                        .from("content")
                        .getPublicUrl(
                            "pdf/" + fileName
                        );


                const fileUrl =
                    publicData.publicUrl;


                /*
                غيّر اسم الجدول إذا كان
                جدول ملفات PDF عندك مختلفًا.
                */

                const {
                    error:
                    dbError
                } =
                    await client
                        .from("pdfs")
                        .insert({

                            title: title,

                            grade: grade,

                            file_url: fileUrl,

                            created_by:
                                ADMIN_AUTH.user.id

                        });


                if(dbError){

                    throw dbError;
                }


                document
                    .getElementById("pdfTitle")
                    .value = "";

                document
                    .getElementById("pdfGrade")
                    .value = "";

                document
                    .getElementById("pdfFile")
                    .value = "";


                showMessage(
                    "تم رفع ملف PDF بنجاح ✅",
                    "success"
                );

            }
            catch(error){

                console.error(
                    "PDF ERROR:",
                    error
                );

                showMessage(
                    "فشل رفع PDF: " +
                    error.message,
                    "error"
                );

            }
            finally{

                btn.disabled = false;

                btn.textContent =
                    "رفع PDF";
            }

        }
    );


/*
=====================================================
 START
=====================================================
*/

(async function(){

    try{

        const admin =
            await ADMIN_AUTH.init();


        if(!admin){
            return;
        }


        client =
            admin.client;


        loadingScreen.style.display =
            "none";


        adminApp.style.display =
            "block";


        console.log(
            "CONTENT ADMIN READY"
        );

    }
    catch(error){

        console.error(
            "CONTENT ERROR:",
            error
        );


        loadingScreen.innerHTML = `

            <div style="
                width:min(600px,92%);
                padding:25px;
                border-radius:20px;
                background:rgba(255,255,255,.04);
                border:1px solid rgba(255,255,255,.08);
                text-align:center;
            ">

                <div style="
                    font-size:45px;
                    margin-bottom:15px;
                ">
                    🔒
                </div>

                <h2>
                    تعذر فتح إدارة المحتوى
                </h2>

                <p style="
                    color:#999;
                    margin-top:12px;
                    line-height:1.8;
                ">
                    ${String(error.message)
                        .replace(/</g,"&lt;")
                        .replace(/>/g,"&gt;")}
                </p>

                <button
                    onclick="location.reload()"
                    style="
                        margin-top:20px;
                        padding:12px 20px;
                        border:0;
                        border-radius:12px;
                        cursor:pointer;
                    "
                >
                    إعادة المحاولة
                </button>

            </div>
        `;
    }

})();

</script>

</body>
</html>
