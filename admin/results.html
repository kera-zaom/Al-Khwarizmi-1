<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نتائج الطلاب | الخوارزمي</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(116,72,232,.22),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(49,84,223,.18),
            transparent 35%
        ),
        #050509;

    color:#fff;
    padding:15px;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.logo{
    font-size:23px;
    font-weight:900;
}

.logo span{
    color:#805cff;
}

.back{
    color:#fff;
    text-decoration:none;
    background:#171722;
    border:1px solid rgba(255,255,255,.1);
    padding:10px 14px;
    border-radius:11px;
}

.card{
    background:rgba(17,17,28,.95);
    border:1px solid rgba(140,100,255,.18);
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
}

.title{
    font-size:25px;
    font-weight:900;
    margin-bottom:6px;
}

.subtitle{
    color:#888;
    line-height:1.7;
}

.stats{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:12px;
    margin-top:15px;
}

.stat{
    background:#0b0b13;
    border:1px solid #29293b;
    border-radius:14px;
    padding:16px;
}

.stat-title{
    color:#888;
    font-size:13px;
    margin-bottom:8px;
}

.stat-value{
    font-size:25px;
    font-weight:900;
}

.search{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #29293b;
    background:#0b0b13;
    color:#fff;
    outline:none;
    font-size:15px;
}

.search:focus{
    border-color:#805cff;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th{
    background:#0b0b13;
    color:#aaa;
    padding:14px 10px;
    text-align:right;
    font-size:13px;
    border-bottom:1px solid #29293b;
}

td{
    padding:14px 10px;
    border-bottom:1px solid rgba(255,255,255,.06);
    font-size:14px;
}

tr:hover td{
    background:rgba(128,92,255,.05);
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
}

.success{
    color:#61e6a7;
    background:rgba(40,180,110,.12);
    border:1px solid rgba(40,180,110,.2);
}

.fail{
    color:#ff6f7c;
    background:rgba(255,70,90,.10);
    border:1px solid rgba(255,70,90,.2);
}

.points{
    color:#c4aaff;
    font-weight:900;
}

.loading{
    text-align:center;
    padding:45px;
    color:#aaa;
}

.error{
    display:none;
    color:#ffd1d5;
    background:#170b0e;
    border:1px solid rgba(255,70,90,.3);
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word;
}

.empty{
    display:none;
    text-align:center;
    padding:45px;
    color:#888;
}

.refresh{
    border:0;
    background:linear-gradient(
        135deg,
        #805cff,
        #3154df
    );
    color:#fff;
    padding:12px 18px;
    border-radius:11px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

@media(max-width:700px){

    body{
        padding:9px;
    }

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .title{
        font-size:21px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            الخوارزمي
            <span>|</span>
            نتائج الطلاب
        </div>

        <a
            href="index.html"
            class="back"
        >
            ← لوحة الإدارة
        </a>

    </div>


    <!-- HEADER -->

    <div class="card">

        <div class="title">
            📊 نتائج الاختبارات
        </div>

        <div class="subtitle">
            جميع نتائج الطلاب والنقاط المكتسبة من الاختبارات.
        </div>


        <div class="stats">

            <div class="stat">

                <div class="stat-title">
                    إجمالي النتائج
                </div>

                <div
                    id="totalResults"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    الناجحون
                </div>

                <div
                    id="passedResults"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    الراسبون
                </div>

                <div
                    id="failedResults"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    مجموع النقاط
                </div>

                <div
                    id="totalPoints"
                    class="stat-value"
                >
                    0
                </div>

            </div>

        </div>

    </div>


    <!-- SEARCH -->

    <div class="card">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="🔎 ابحث باسم الطالب أو الاختبار..."
        >

        <button
            id="refresh"
            class="refresh"
        >
            🔄 تحديث النتائج
        </button>

    </div>


    <!-- ERROR -->

    <div
        id="error"
        class="card error"
    ></div>


    <!-- LOADING -->

    <div
        id="loading"
        class="card loading"
    >
        ⏳ جاري تحميل النتائج...
    </div>


    <!-- EMPTY -->

    <div
        id="empty"
        class="card empty"
    >
        📭 لا توجد نتائج حتى الآن.
    </div>


    <!-- TABLE -->

    <div
        id="tableCard"
        class="card"
        style="display:none"
    >

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            الطالب
                        </th>

                        <th>
                            الاختبار
                        </th>

                        <th>
                            الدرجة
                        </th>

                        <th>
                            النسبة
                        </th>

                        <th>
                            الحالة
                        </th>

                        <th>
                            النقاط
                        </th>

                        <th>
                            التاريخ
                        </th>

                    </tr>

                </thead>

                <tbody
                    id="resultsBody"
                ></tbody>

            </table>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>


<script>

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
    document.getElementById(
        "loading"
    );

const errorBox =
    document.getElementById(
        "error"
    );

const emptyBox =
    document.getElementById(
        "empty"
    );

const tableCard =
    document.getElementById(
        "tableCard"
    );

const body =
    document.getElementById(
        "resultsBody"
    );

const search =
    document.getElementById(
        "search"
    );


/* =====================================================
   STATE
===================================================== */

let client = null;

let allResults = [];


/* =====================================================
   ERROR
===================================================== */

function showError(message){

    console.error(
        message
    );

    loading.style.display =
        "none";

    tableCard.style.display =
        "none";

    emptyBox.style.display =
        "none";

    errorBox.style.display =
        "block";

    errorBox.textContent =
        "⚠️ حدث خطأ:\n\n" +
        message;

}


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

    if(!value){
        return "-";
    }

    try{

        return new Date(
            value
        ).toLocaleString(
            "ar-EG",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        );

    }
    catch{

        return value;

    }

}


/* =====================================================
   LOAD
===================================================== */

async function loadResults(){

    try{

        loading.style.display =
            "block";

        errorBox.style.display =
            "none";

        emptyBox.style.display =
            "none";

        tableCard.style.display =
            "none";


        client =
            window.supabaseClient;


        if(!client){

            showError(
                "لم يتم إنشاء اتصال Supabase."
            );

            return;

        }


        /* =============================================
           AUTH
        ============================================= */

        const {
            data:userData,
            error:userError
        } =
        await client.auth.getUser();


        if(userError){

            showError(
                userError.message
            );

            return;

        }


        if(!userData?.user){

            location.href =
                "login.html";

            return;

        }


        /*
         * نقرأ النتائج.
         *
         * لا نستخدم join مع profiles
         * حتى لا نكسر الاستعلام لو
         * العلاقة غير معرفة في Supabase.
         */

        const {
            data:results,
            error:resultsError
        } =
        await client
            .from("results")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(resultsError){

            showError(
                resultsError.message
            );

            return;

        }


        if(
            !results ||
            results.length === 0
        ){

            allResults = [];

            updateStats();

            loading.style.display =
                "none";

            emptyBox.style.display =
                "block";

            return;

        }


        /*
         * جلب أسماء الاختبارات
         */

        const examIds =
            [
                ...new Set(
                    results
                        .map(
                            r => r.exam_id
                        )
                        .filter(Boolean)
                )
            ];


        let exams = [];


        if(examIds.length){

            const {
                data:examData,
                error:examError
            } =
            await client
                .from("exams")
                .select(
                    "id,title"
                )
                .in(
                    "id",
                    examIds
                );


            if(examError){

                console.warn(
                    "Exam names error:",
                    examError.message
                );

            }
            else{

                exams =
                    examData || [];

            }

        }


        /*
         * جلب النقاط
         */

        const resultIds =
            results
                .map(
                    r => r.id
                )
                .filter(Boolean);


        let points = [];


        if(resultIds.length){

            const {
                data:pointsData,
                error:pointsError
            } =
            await client
                .from("student_points")
                .select(
                    "result_id,points"
                )
                .in(
                    "result_id",
                    resultIds
                );


            if(pointsError){

                console.warn(
                    "Points error:",
                    pointsError.message
                );

            }
            else{

                points =
                    pointsData || [];

            }

        }


        /*
         * بناء البيانات النهائية
         */

        allResults =
            results.map(
                result => {

                    const exam =
                        exams.find(
                            e =>
                                e.id ===
                                result.exam_id
                        );


                    const point =
                        points.find(
                            p =>
                                p.result_id ===
                                result.id
                        );


                    return {

                        ...result,

                        examTitle:
                            exam?.title ||
                            "اختبار غير معروف",

                        points:
                            Number(
                                point?.points ??
                                result.score ??
                                0
                            )

                    };

                }
            );


        updateStats();

        renderResults(
            allResults
        );


    }
    catch(error){

        showError(
            error?.message ||
            String(error)
        );

    }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    const total =
        allResults.length;


    const passed =
        allResults.filter(
            r =>
                r.passed === true
        ).length;


    const failed =
        total - passed;


    const points =
        allResults.reduce(
            (sum,r) =>
                sum +
                (
                    Number(
                        r.points
                    ) || 0
                ),
            0
        );


    document.getElementById(
        "totalResults"
    ).textContent =
        total;


    document.getElementById(
        "passedResults"
    ).textContent =
        passed;


    document.getElementById(
        "failedResults"
    ).textContent =
        failed;


    document.getElementById(
        "totalPoints"
    ).textContent =
        points;

}


/* =====================================================
   RENDER
===================================================== */

function renderResults(results){

    loading.style.display =
        "none";


    body.innerHTML =
        "";


    if(
        !results ||
        results.length === 0
    ){

        tableCard.style.display =
            "none";

        emptyBox.style.display =
            "block";

        return;

    }


    emptyBox.style.display =
        "none";

    tableCard.style.display =
        "block";


    results.forEach(
        result => {

            const row =
                document.createElement(
                    "tr"
                );


            const passed =
                result.passed === true;


            row.innerHTML = `

                <td>

                    <strong>
                        الطالب
                    </strong>

                    <br>

                    <small
                        style="
                            color:#777;
                            direction:ltr;
                            display:inline-block;
                        "
                    >
                        ${escapeHTML(
                            result.student_id
                        )}
                    </small>

                </td>


                <td>

                    ${escapeHTML(
                        result.examTitle
                    )}

                </td>


                <td>

                    <strong>

                        ${escapeHTML(
                            result.score
                        )}

                    </strong>

                    /

                    ${escapeHTML(
                        result.total_points
                    )}

                </td>


                <td>

                    ${escapeHTML(
                        result.percentage
                    )}%

                </td>


                <td>

                    <span
                        class="
                            badge
                            ${passed
                                ? "success"
                                : "fail"}
                        "
                    >

                        ${
                            passed
                            ? "ناجح ✅"
                            : "راسب ❌"
                        }

                    </span>

                </td>


                <td>

                    <span class="points">

                        ⭐ +

                        ${escapeHTML(
                            result.points
                        )}

                    </span>

                </td>


                <td>

                    ${escapeHTML(
                        formatDate(
                            result.created_at
                        )
                    )}

                </td>

            `;


            body.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
    "input",
    () => {

        const value =
            search.value
                .trim()
                .toLowerCase();


        if(!value){

            renderResults(
                allResults
            );

            return;

        }


        const filtered =
            allResults.filter(
                result => {

                    return (

                        String(
                            result.student_id
                        )
                        .toLowerCase()
                        .includes(value)

                        ||

                        String(
                            result.examTitle
                        )
                        .toLowerCase()
                        .includes(value)

                    );

                }
            );


        renderResults(
            filtered
        );

    }
);


/* =====================================================
   REFRESH
===================================================== */

document
    .getElementById("refresh")
    .addEventListener(
        "click",
        loadResults
    );


/* =====================================================
   RUN
===================================================== */

loadResults();

</script>

</body>

</html>
