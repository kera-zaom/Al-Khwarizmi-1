<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>إضافة اختبار | الخوارزمي</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Tahoma, sans-serif;
}

body {

    min-height: 100vh;

    background:
    radial-gradient(
        circle at 20% 10%,
        rgba(116,72,232,.25),
        transparent 35%
    ),
    radial-gradient(
        circle at 90% 80%,
        rgba(49,84,223,.20),
        transparent 35%
    ),
    #050509;

    color: white;

    padding: 25px;
}

.container {

    max-width: 850px;

    margin: auto;
}

.header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 30px;

    gap: 15px;
}

.header h1 {

    font-size: 28px;
}

.back {

    text-decoration: none;

    color: white;

    padding: 11px 18px;

    border-radius: 12px;

    background:
    linear-gradient(
        135deg,
        #7448e8,
        #3154df
    );
}

.form {

    background: rgba(17,17,28,.95);

    border: 1px solid rgba(140,100,255,.2);

    border-radius: 22px;

    padding: 25px;
}

.field {

    margin-bottom: 20px;
}

label {

    display: block;

    margin-bottom: 8px;

    color: #ddd;
}

input,
textarea,
select {

    width: 100%;

    padding: 14px;

    border-radius: 12px;

    border: 1px solid #303044;

    background: #0b0b13;

    color: white;

    outline: none;

    font-size: 15px;
}

textarea {

    min-height: 120px;

    resize: vertical;
}

input:focus,
textarea:focus,
select:focus {

    border-color: #7448e8;
}

.row {

    display: grid;

    grid-template-columns:
    repeat(2, 1fr);

    gap: 15px;
}

.submit {

    width: 100%;

    border: 0;

    padding: 15px;

    border-radius: 13px;

    background:
    linear-gradient(
        135deg,
        #7448e8,
        #3154df
    );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.submit:disabled {

    opacity: .6;

    cursor: not-allowed;
}

.message {

    margin-top: 15px;

    padding: 12px;

    border-radius: 10px;

    display: none;

    background: #11111c;

    color: #ddd;
}

@media(max-width:600px) {

    body {
        padding: 15px;
    }

    .header {

        flex-direction: column;

        align-items: stretch;
    }

    .back {

        text-align: center;
    }

    .row {

        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div>

            <h1>➕ إضافة اختبار</h1>

        </div>

        <a
            href="exams.html"
            class="back"
        >
            الاختبارات
        </a>

    </div>


    <form
        id="examForm"
        class="form"
    >

        <div class="field">

            <label>
                اسم الاختبار
            </label>

            <input
                id="title"
                type="text"
                placeholder="مثال: اختبار الوحدة الأولى"
                required
            >

        </div>


        <div class="field">

            <label>
                وصف الاختبار
            </label>

            <textarea
                id="description"
                placeholder="اكتب وصفًا مختصرًا للاختبار"
            ></textarea>

        </div>


        <div class="row">

            <div class="field">

                <label>
                    الصف الدراسي
                </label>

                <select
                    id="grade"
                    required
                >

                    <option value="">
                        اختر الصف
                    </option>

                    <option value="أولى إعدادي">
                        أولى إعدادي
                    </option>

                    <option value="ثانية إعدادي">
                        ثانية إعدادي
                    </option>

                    <option value="ثالثة إعدادي">
                        ثالثة إعدادي
                    </option>

                    <option value="أولى ثانوي">
                        أولى ثانوي
                    </option>

                    <option value="ثانية ثانوي">
                        ثانية ثانوي
                    </option>

                    <option value="ثالثة ثانوي">
                        ثالثة ثانوي
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    مدة الاختبار بالدقائق
                </label>

                <input
                    id="duration"
                    type="number"
                    min="1"
                    max="300"
                    value="30"
                    required
                >

            </div>

        </div>


        <div class="field">

            <label>
                المدرس
            </label>

            <select id="teacher">

                <option value="">
                    بدون تحديد
                </option>

            </select>

        </div>


        <button
            id="submitBtn"
            class="submit"
            type="submit"
        >
            إنشاء الاختبار
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </form>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="js/admin.js"></script>

<script src="js/exams.js"></script>

</body>

</html>
