<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>الخوارزمي | تسجيل الدخول</title>

<style>

/* ==================================================
   RESET
================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    color:#fff;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(116,72,232,.25),
            transparent 35%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(49,84,223,.20),
            transparent 35%
        ),

        #050509;

    overflow-x:hidden;
}


/* ==================================================
   BACKGROUND
================================================== */

.bubble{

    position:fixed;

    border-radius:50%;

    pointer-events:none;

    filter:blur(4px);

    opacity:.25;

    animation:
        floatBubble 7s ease-in-out infinite;

    z-index:-1;
}

.bubble.one{

    width:120px;
    height:120px;

    background:#7448e8;

    top:8%;
    right:5%;
}

.bubble.two{

    width:75px;
    height:75px;

    background:#3154df;

    bottom:10%;
    left:7%;

    animation-delay:2s;
}

@keyframes floatBubble{

    0%,100%{
        transform:translate(0,0);
    }

    50%{
        transform:translate(15px,-25px);
    }
}


/* ==================================================
   CARD
================================================== */

.card{

    width:min(500px,100%);

    padding:30px 24px;

    border-radius:30px;

    background:
        rgba(10,10,16,.90);

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:

        0 30px 90px
        rgba(0,0,0,.55),

        0 0 60px
        rgba(116,72,232,.12);

    backdrop-filter:blur(22px);

    -webkit-backdrop-filter:blur(22px);
}


/* ==================================================
   LOGO
================================================== */

.logo{

    text-align:center;

    margin-bottom:26px;
}


/* ==================================================
   TEACHER IMAGE
================================================== */

.teacher-logo{

    width:110px;
    height:110px;

    margin:0 auto;

    padding:4px;

    border-radius:50%;

    background:

        linear-gradient(
            135deg,
            #7448e8,
            #3154df,
            #a36cff
        );

    box-shadow:

        0 0 25px
        rgba(116,72,232,.45),

        0 0 60px
        rgba(49,84,223,.20);

    position:relative;

    overflow:hidden;

    animation:

        teacherFloat 3s
        ease-in-out
        infinite,

        teacherGlow 2.5s
        ease-in-out
        infinite alternate;
}


/* الصورة */

.teacher-logo img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    border-radius:50%;

    position:relative;

    z-index:2;
}


/* الحلقة الداخلية */

.teacher-logo::before{

    content:"";

    position:absolute;

    inset:7px;

    border-radius:50%;

    border:

        1px solid
        rgba(255,255,255,.30);

    z-index:3;

    pointer-events:none;
}


/* اللمعة */

.teacher-logo::after{

    content:"";

    position:absolute;

    width:45%;

    height:150%;

    top:-25%;

    left:-80%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.45),
            transparent
        );

    transform:rotate(25deg);

    z-index:4;

    pointer-events:none;

    animation:
        teacherShine 3.5s
        ease-in-out
        infinite;
}


@keyframes teacherFloat{

    0%,100%{

        transform:
            translateY(0)
            rotate(0deg);

    }

    50%{

        transform:
            translateY(-9px)
            rotate(1deg);

    }
}


@keyframes teacherGlow{

    from{

        box-shadow:

            0 0 20px
            rgba(116,72,232,.35),

            0 0 45px
            rgba(49,84,223,.15);

    }

    to{

        box-shadow:

            0 0 35px
            rgba(116,72,232,.70),

            0 0 75px
            rgba(49,84,223,.28);

    }
}


@keyframes teacherShine{

    0%{

        left:-80%;

    }

    45%,
    100%{

        left:140%;

    }
}


/* ==================================================
   TITLE
================================================== */

.logo h1{

    margin-top:16px;

    font-size:31px;

    font-weight:900;

    background:

        linear-gradient(
            135deg,
            #ffffff,
            #bca8ff
        );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.logo p{

    color:#888894;

    margin-top:7px;

    font-size:14px;
}


/* ==================================================
   TABS
================================================== */

.tabs{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:6px;

    padding:5px;

    margin-bottom:22px;

    border-radius:15px;

    background:
        rgba(255,255,255,.04);
}


.tab{

    border:0;

    padding:13px;

    border-radius:11px;

    color:#888;

    background:transparent;

    cursor:pointer;

    font-weight:bold;

    font-size:14px;

    transition:.3s;
}


.tab.active{

    color:#fff;

    background:

        linear-gradient(
            135deg,
            #7448e8,
            #3154df
        );

    box-shadow:

        0 5px 20px
        rgba(116,72,232,.18);
}


/* ==================================================
   FORMS
================================================== */

.form{

    display:none;
}


.form.active{

    display:block;

    animation:
        showForm .35s ease;
}


@keyframes showForm{

    from{

        opacity:0;

        transform:
            translateY(12px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }
}


/* ==================================================
   INPUT
================================================== */

.field{

    margin-bottom:15px;
}


.field label{

    display:block;

    margin-bottom:7px;

    color:#bdbdc6;

    font-size:13px;
}


.input{

    width:100%;

    padding:14px;

    border-radius:13px;

    outline:none;

    color:#fff;

    background:
        rgba(255,255,255,.045);

    border:

        1px solid
        rgba(255,255,255,.09);

    transition:.25s;
}


.input:focus{

    border-color:#7448e8;

    box-shadow:

        0 0 0 3px
        rgba(116,72,232,.10);
}


.input::placeholder{

    color:#666672;
}


select.input option{

    color:#000;
}


/* ==================================================
   TWO COLUMNS
================================================== */

.two{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;
}


/* ==================================================
   BUTTON
================================================== */

.button{

    width:100%;

    border:0;

    padding:15px;

    border-radius:14px;

    color:#fff;

    background:

        linear-gradient(
            135deg,
            #7448e8,
            #3154df
        );

    font-size:16px;

    font-weight:900;

    cursor:pointer;

    transition:.25s;

    box-shadow:

        0 12px 30px
        rgba(116,72,232,.18);
}


.button:hover{

    transform:translateY(-2px);

    box-shadow:

        0 17px 35px
        rgba(116,72,232,.30);
}


.button:disabled{

    opacity:.55;

    cursor:not-allowed;

    transform:none;
}


/* ==================================================
   MESSAGE
================================================== */

.message{

    display:none;

    padding:12px;

    margin-bottom:15px;

    border-radius:12px;

    text-align:center;

    font-size:13px;

    line-height:1.8;
}


.message.show{

    display:block;
}


.message.error{

    color:#ffb0b0;

    background:
        rgba(255,70,70,.08);

    border:
        1px solid
        rgba(255,70,70,.15);
}


.message.success{

    color:#aaffc2;

    background:
        rgba(40,220,100,.07);

    border:
        1px solid
        rgba(40,220,100,.15);
}


/* ==================================================
   OTP
================================================== */

.otp-box{

    display:none;

    margin-top:15px;

    padding-top:5px;

    animation:
        showForm .35s ease;
}


.otp-box.show{

    display:block;
}


.otp-input{

    text-align:center;

    letter-spacing:9px;

    font-size:25px;

    font-weight:900;
}


.small-button{

    width:100%;

    margin-top:10px;

    padding:11px;

    border:

        1px solid
        rgba(255,255,255,.08);

    border-radius:12px;

    background:
        rgba(255,255,255,.035);

    color:#aaa;

    cursor:pointer;

    transition:.25s;
}


.small-button:hover{

    color:#fff;

    border-color:
        rgba(116,72,232,.35);
}


/* ==================================================
   BACK
================================================== */

.back{

    display:block;

    text-align:center;

    margin-top:20px;

    color:#888;

    text-decoration:none;

    font-size:13px;
}


.back:hover{

    color:#a78cff;
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:550px){

    body{

        padding:12px;

        align-items:flex-start;

        padding-top:20px;
    }


    .card{

        padding:25px 16px;

        border-radius:25px;
    }


    .two{

        grid-template-columns:1fr;
    }


    .teacher-logo{

        width:100px;
        height:100px;
    }


    .logo h1{

        font-size:28px;
    }

}

</style>

</head>


<body>


<div class="bubble one"></div>
<div class="bubble two"></div>


<div class="card">


    <!-- ======================================
         LOGO
    ======================================= -->

    <div class="logo">

        <div class="teacher-logo">

            <img
                src="teacher.png"
                alt="صورة المستر"
                onerror="
                    this.src='teacher.jpg';
                "
            >

        </div>


        <h1>

        </h1>


        <p>

         TABS
    ======================================= -->

        >

<!-- ==================================================
     SUPABASE LIBRARY
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

"use strict";


/* ==================================================
   VARIABLES
================================================== */

const loginTab =
    document.getElementById(
        "loginTab"
    );


const registerTab =
    document.getElementById(
        "registerTab"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const registerForm =
    document.getElementById(
        "registerForm"
    );


const message =
    document.getElementById(
        "message"
    );


const loginOtpBox =
    document.getElementById(
        "loginOtpBox"
    );


const registerOtpBox =
    document.getElementById(
        "registerOtpBox"
    );


let loginPhoneSaved =
    "";


let registerPhoneSaved =
    "";


/* ==================================================
   SUPABASE
================================================== */

function getSupabase(){

    if(
        typeof supabaseClient ===
        "undefined" ||
        !supabaseClient
    ){

        throw new Error(
            "Supabase غير متصل. تأكد من ملف supabase.js."
        );

    }

    return supabaseClient;
}


/* ==================================================
   PHONE
================================================== */

function validEgyptianPhone(phone){

    const clean =
        String(phone)
            .replace(/\s+/g,"")
            .replace(/-/g,"");


    return /^01[0125][0-9]{8}$/
        .test(clean);
}


function normalizePhone(phone){

    let clean =
        String(phone)
            .replace(/\s+/g,"")
            .replace(/-/g,"");


    if(
        clean.startsWith("+20")
    ){

        return clean;

    }


    if(
        clean.startsWith("20")
    ){

        return "+" + clean;

    }


    if(
        clean.startsWith("01")
    ){

        return "+20" +
            clean.substring(1);

    }


    return clean;
}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message show " +
        type;
}


function hideMessage(){

    message.textContent =
        "";

    message.className =
        "message";
}


/* ==================================================
   LOADING
================================================== */

function loading(
    button,
    state,
    normalText
){

    button.disabled =
        state;

    button.textContent =
        state
        ? "⏳ جاري..."
        : normalText;
}


/* ==================================================
   LOGIN TAB
================================================== */

loginTab.addEventListener(
    "click",
    function(){

        loginTab.classList.add(
            "active"
        );

        registerTab.classList.remove(
            "active"
        );


        loginForm.classList.add(
            "active"
        );

        registerForm.classList.remove(
            "active"
        );


        hideMessage();

    }
);


/* ==================================================
   REGISTER TAB
================================================== */

registerTab.addEventListener(
    "click",
    function(){

        registerTab.classList.add(
            "active"
        );

        loginTab.classList.remove(
            "active"
        );


        registerForm.classList.add(
            "active"
        );

        loginForm.classList.remove(
            "active"
        );


        hideMessage();

    }
);


/* ==================================================
   REGISTER SEND OTP
================================================== */

registerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        hideMessage();


        const fullName =
            document
                .getElementById(
                    "fullName"
                )
                .value
                .trim();


        const phoneInput =
            document
                .getElementById(
                    "registerPhone"
                )
                .value
                .trim();


        const parentPhoneInput =
            document
                .getElementById(
                    "parentPhone"
                )
                .value
                .trim();


        const grade =
            document
                .getElementById(
                    "grade"
                )
                .value;


        const governorate =
            document
                .getElementById(
                    "governorate"
                )
                .value
                .trim();


        const city =
            document
                .getElementById(
                    "city"
                )
                .value
                .trim();


        const school =
            document
                .getElementById(
                    "school"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "password"
                )
                .value;


        const confirmPassword =
            document
                .getElementById(
                    "confirmPassword"
                )
                .value;


        const button =
            document.getElementById(
                "sendRegisterOtp"
            );


        if(
            fullName.length < 3
        ){

            showMessage(
                "❌ اكتب الاسم بالكامل.",
                "error"
            );

            return;
        }


        if(
            !validEgyptianPhone(
                phoneInput
            )
        ){

            showMessage(
                "❌ رقم الموبايل المصري غير صحيح.",
                "error"
            );

            return;
        }


        if(
            !validEgyptianPhone(
                parentPhoneInput
            )
        ){

            showMessage(
                "❌ رقم ولي الأمر غير صحيح.",
                "error"
            );

            return;
        }


        if(!grade){

            showMessage(
                "❌ اختر الصف الدراسي.",
                "error"
            );

            return;
        }


        if(
            password.length < 6
        ){

            showMessage(
                "❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
                "error"
            );

            return;
        }


        if(
            password !==
            confirmPassword
        ){

            showMessage(
                "❌ كلمتا المرور غير متطابقتين.",
                "error"
            );

            return;
        }


        const phone =
            normalizePhone(
                phoneInput
            );


        registerPhoneSaved =
            phone;


        loading(
            button,
            true,
            "📱 إنشاء الحساب وإرسال الكود"
        );


        try{

            const supabase =
                getSupabase();


            /*
             * إرسال OTP
             */

            const {
                error
            } =
            await supabase.auth
                .signInWithOtp({

                    phone: phone,

                    options:{

                        shouldCreateUser:true

                    }

                });


            if(error){

                throw error;

            }


            /*
             * حفظ بيانات التسجيل
             * مؤقتًا حتى تأكيد OTP
             */

            sessionStorage.setItem(
                "register_data",
                JSON.stringify({

                    full_name:

document
    .getElementById(
        "verifyRegisterButton"
    )
    .addEventListener(
        "click",
        async function(){

            const button =
                this;


            const otp =
                document
                    .getElementById(
                        "registerOtp"
                    )
                    .value
                    .trim();


            if(
                !/^[0-9]{6}$/.test(
                    otp
                )
            ){

                showMessage(
                    "❌ أدخل كود التحقق المكون من 6 أرقام.",
                    "error"
                );

                return;
            }


            loading(
                button,
                true,
                "✅ تأكيد الكود وإنشاء الحساب"
            );


            try{

                const supabase =
                    getSupabase();


                const {
                    data,
                    error
                } =
                await supabase.auth
                    .verifyOtp({

                        phone:
                            registerPhoneSaved,

                        token:
                            otp,

                        type:
                            "sms"

                    });


                if(error){

                    throw error;

                }


                const user =
                    data.user;


                if(!user){

                    throw new Error(
                        "لم يتم إنشاء المستخدم."
                    );

                }


                const saved =
                    sessionStorage.getItem(
                        "register_data"
                    );


                if(!saved){

                    throw new Error(
                        "بيانات التسجيل غير موجودة."
                    );

                }


                const student =
                    JSON.parse(
                        saved
                    );


                /*
                 * حفظ الطالب
                 */

                const {
                    error:
                    studentError
                } =
                await supabase
                    .from("students")
                    .upsert({

                        id:
                            user.id,

                        full_name:
                            student.full_name,

                        phone:
                            student.phone,

                        parent_phone:
                            student.parent_phone,

                        grade:
                            student.grade,

                        governorate:
                            student.governorate,

                        city:
                            student.city,

                        school:
                            student.school,

                        points:
                            0

                    },{
                        onConflict:"id"
                    });


                if(studentError){

                    throw studentError;

                }


                sessionStorage.removeItem(
                    "register_data"
                );


                showMessage(
                    "🎉 تم إنشاء الحساب وتأكيد رقم الهاتف بنجاح!",
                    "success"
                );


                setTimeout(
                    function(){

                        window.location.href =
                            "home.html";

                    },
                    1000
                );


            }catch(error){

                console.error(
                    "VERIFY REGISTER:",
                    error
                );


                showMessage(
                    friendlyError(error),
                    "error"
                );

            }


            loading(
                button,
                false,
                "✅ تأكيد الكود وإنشاء الحساب"
            );

        }
    );

/* ==================================================
   ERRORS
================================================== */

function friendlyError(error){

    const text =
        String(
            error?.message ||
            error ||
            ""
        );


    const lower =
        text.toLowerCase();


    if(
        lower.includes(
            "rate limit"
        )
    ){

        return "⏳ تم تجاوز حد إرسال الرسائل مؤقتًا. انتظر قليلًا ثم حاول مرة أخرى.";

    }


    if(
        lower.includes(
            "invalid phone"
        )
    ){

        return "❌ رقم الهاتف غير صحيح.";

    }


    if(
        lower.includes(
            "invalid otp"
        )
    ){

        return "❌ كود التحقق غير صحيح.";

    }


    if(
        lower.includes(
            "expired"
        )
    ){

        return "⌛ انتهت صلاحية الكود. اطلب كودًا جديدًا.";

    }


    if(
        lower.includes(
            "not found"
        )
    ){

        return "❌ هذا الرقم غير مسجل.";

    }


    return "❌ " + text;

}
